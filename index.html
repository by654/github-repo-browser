async function loadRepo(owner, repo, opts){
  opts = opts || {};
  var token = ++S.loadToken;
  S.owner = owner; S.repo = repo;
  S.branch = opts.branch || '';
  S.path = ''; S.kind = ''; S.text = ''; S.meta = null; S.tree = []; S.root = null;
  S.releases = []; S.readmePath = ''; S.readmeText = ''; S.readmeHtml = '';
  S.lastError = null; S.loading = true; S.expanded = {}; S.mDir = '';
  S.translated = false; S.trMap = {}; S.outline = [];
  S.branches = []; S.branchMissing = ''; S.branchError = ''; S.branchQuery = ''; S.headCommit = null;
  S.mobileView = S.mobileView || 'overview';
  closeMobileReader(true);
  resetReader();
  renderChrome();
  renderOverview();
  renderMobileOverview();
  renderTree();
  renderMobileFiles();

  try {
    var meta = await gh('/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo));
    if (token !== S.loadToken) return;
    S.meta = meta;
    var def = meta.default_branch || 'main';
    try {
      S.branches = await loadBranches(owner, repo);
    } catch(be){
      S.branches = [];
      S.branchError = (be && be.message) || '';
    }
    if (token !== S.loadToken) return;
    var wanted = opts.branch || '';
    if (wanted && wanted !== def) {
      var known = S.branches.some(function(b){ return b.name === wanted; });
      if (!known && S.branches.length) S.branchMissing = wanted;
    }
    S.branch = S.branchMissing ? def : (wanted || def);
    renderChrome();

    var results = await Promise.all([
      loadReadme(owner, repo).catch(function(e){ return e; }),
      loadTree(owner, repo, S.branch).catch(function(e){ return e; }),
      loadReleases(owner, repo).catch(function(e){ return e; }),
      loadHeadCommit(S.branch).catch(function(e){ return e; })
    ]);
    if (token !== S.loadToken) return;
    if (results[1] instanceof Error && !S.branchMissing && wanted && wanted !== def && results[1].status === 404) {
      S.branchMissing = wanted;
      S.branch = def;
      results[0] = await loadReadme(owner, repo).catch(function(e){ return e; });
      results[1] = await loadTree(owner, repo, def).catch(function(e){ return e; });
      results[3] = await loadHeadCommit(def);
    }
    if (token !== S.loadToken) return;
    if (results[0] instanceof Error) S.readmeError = results[0].message; else S.readmeError = '';
    if (results[1] instanceof Error) S.treeError = results[1].message; else S.treeError = '';
    if (results[2] instanceof Error) S.releaseError = results[2].message; else S.releaseError = '';
    S.loading = false;

    pushRecent(owner, repo, S.branch);
    renderChrome();
    renderOverview();
    renderMobileOverview();
    renderTree();
    renderMobileFiles();
    writeHash();
    renderBranchSheet();

    if (opts.path) {
      await openFile(opts.path, { silent: true });
    } else if (opts.release) {
      openReleaseByTag(opts.release);
    } else if (cfg.autoReadme && S.readmePath) {
      await openFile(S.readmePath, { silent: true });
    }
  } catch(err){
    if (token !== S.loadToken) return;
    S.loading = false;
    S.lastError = err;
    renderChrome();
    renderOverview();
    renderMobileOverview();
    if (err && err.status === 404) toast('仓库不存在或没有公开访问权限', 'err', 4200);
  }
}

async function loadReadme(owner, repo){
  var data = await gh('/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) + '/readme');
  S.readmePath = data.path || 'README.md';
  var txt = '';
  if (data.content && data.encoding === 'base64') txt = b64ToText(data.content);
  else if (data.download_url) txt = await fetchRaw(S.readmePath, S.branch);
  S.readmeText = txt;
  S.readmeHtml = txt ? mdToHtml(txt, S.readmePath) : '';
  return txt;
}
function b64ToText(b64){
  try {
    var bin = atob(String(b64).replace(/\s/g, ''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  } catch(e){ return ''; }
}
async function loadTree(owner, repo, branch){
  var data = await gh('/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) + '/git/trees/' + encodeURIComponent(branch) + '?recursive=1');
  var items = (data.tree || []).filter(function(x){ return x.type === 'blob'; });
  S.tree = items.map(function(x){ return { path: x.path, size: x.size, sha: x.sha }; });
  S.treeTruncated = !!data.truncated;
  S.root = buildTree(S.tree);
  if (S.path) revealTreeTo(S.path);
  return S.tree;
}
async function loadBranches(owner, repo){
  var all = [];
  for (var page = 1; page <= 3; page++) {
    var data = await gh('/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) + '/branches?per_page=100&page=' + page);
    if (!Array.isArray(data) || !data.length) break;
    data.forEach(function(b){
      all.push({ name: b.name, sha: (b.commit && b.commit.sha) || '', 'protected': !!b.protected });
    });
    if (data.length < 100) break;
  }
  return all;
}
async function loadHeadCommit(branch){
  if (!S.owner || !S.repo || !branch) { S.headCommit = null; return null; }
  try {
    var data = await gh('/repos/' + encodeURIComponent(S.owner) + '/' + encodeURIComponent(S.repo) + '/commits?sha=' + encodeURIComponent(branch) + '&per_page=1');
    var c = Array.isArray(data) ? data[0] : null;
    S.headCommit = c ? {
      sha: c.sha || '',
      message: ((c.commit && c.commit.message) || '').split('\n')[0],
      date: (c.commit && c.commit.author && c.commit.author.date) || ''
    } : null;
  } catch(e){ S.headCommit = null; }
  return S.headCommit;
}
async function loadReleases(owner, repo){
  var data = await gh('/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) + '/releases?per_page=8');
  S.releases = Array.isArray(data) ? data : [];
  return S.releases;
}
function buildTree(items){
  var root = { name: '', path: '', type: 'dir', children: {} };
  items.forEach(function(it){
    var parts = String(it.path).split('/');
    var node = root;
    parts.forEach(function(name, i){
      var p = parts.slice(0, i + 1).join('/');
      var last = i === parts.length - 1;
      if (!node.children[name]) {
        node.children[name] = { name: name, path: p, type: last ? 'file' : 'dir', size: last ? it.size : null, children: {} };
      }
      node = node.children[name];
      if (last) { node.type = 'file'; node.size = it.size; }
    });
  });
  return root;
}
function sortedChildren(node){
  if (!node || !node.children) return [];
  return Object.keys(node.children).map(function(k){ return node.children[k]; }).sort(function(a,b){
    if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
    return a.name.localeCompare(b.name, 'zh-CN', {numeric:true, sensitivity:'base'});
  });
}
function dirChildren(path){
  if (!S.root) return [];
  if (!path) return sortedChildren(S.root);
  var node = S.root;
  var parts = String(path).split('/').filter(Boolean);
  for (var i = 0; i < parts.length; i++) {
    node = node.children && node.children[parts[i]];
    if (!node) return [];
  }
  return sortedChildren(node);
}
function revealTreeTo(path){
  var parts = String(path || '').split('/');
  parts.pop();
  var acc = [];
  parts.forEach(function(p){ acc.push(p); S.expanded[acc.join('/')] = true; });
}
function extBadge(path){
  var b = baseOf(path);
  var up = b.toUpperCase();
  if (/^README(\.|$)/.test(up)) return 'MD';
  if (/^LICENSE(\.|$)/.test(up)) return 'LIC';
  var e = extOf(path);
  var map = {
    md:'MD', markdown:'MD', mdx:'MDX', txt:'TXT', rst:'RST',
    js:'JS', mjs:'JS', cjs:'JS', jsx:'JSX', ts:'TS', tsx:'TSX',
    json:'{}', jsonc:'{}', yml:'YML', yaml:'YML', toml:'TML',
    html:'HTML', htm:'HTML', css:'CSS', scss:'SCSS', less:'LESS',
    py:'PY', rb:'RB', go:'GO', rs:'RS', java:'JAVA', kt:'KT',
    c:'C', h:'H', cpp:'C++', cc:'C++', hpp:'H++', cs:'C#', php:'PHP',
    sh:'SH', bash:'SH', zsh:'SH', ps1:'PS1', bat:'BAT', fish:'SH',
    sql:'SQL', vue:'VUE', svelte:'SV', swift:'SWIFT', dart:'DART',
    lua:'LUA', r:'R', pl:'PL', ex:'EX', exs:'EX', erl:'ERL', hs:'HS',
    xml:'XML', svg:'SVG', png:'IMG', jpg:'IMG', jpeg:'IMG', gif:'IMG', webp:'IMG', ico:'IMG', bmp:'IMG',
    pdf:'PDF', zip:'ZIP', gz:'GZ', tar:'TAR', woff:'FNT', woff2:'FNT', ttf:'FNT', otf:'FNT',
    ipynb:'NB', gradle:'GRD', dockerfile:'DKR', lock:'LCK', env:'ENV', conf:'CFG', ini:'INI'
  };
  if (map[e]) return map[e];
  if (b === 'Dockerfile') return 'DKR';
  if (b === 'Makefile') return 'MK';
  if (e) return e.slice(0, 4).toUpperCase();
  return 'TXT';
}

var BINARY_EXT = ['pdf','zip','gz','tar','rar','7z','woff','woff2','ttf','otf','eot','mp4','webm','mp3','wav','ogg','wasm','exe','dll','so','dylib','apk','aab','jar','class','bin','ico','psd','ppt','pptx','doc','docx','xls','xlsx'];

function suggestBranches(name){
  var q = String(name || '').toLowerCase();
  if (!q || !S.branches || !S.branches.length) return [];
  var def = (S.meta && S.meta.default_branch) || '';
  var scored = [];
  S.branches.forEach(function(b){
    if (!b || b.name === def) return;
    var n = b.name.toLowerCase(), score = 0;
    if (n === q) score = 100;
    else if (n.indexOf(q) === 0) score = 70;
    else if (n.indexOf(q) >= 0) score = 50;
    else {
      var pre = 0;
      while (pre < q.length && pre < n.length && q[pre] === n[pre]) pre++;
      if (pre >= 2) score = 20 + pre;
      else if (n.split(/[-_./]/).some(function(seg){ return q.indexOf(seg.slice(0, 3)) >= 0 && seg.length > 2; })) score = 12;
    }
    if (score > 0) scored.push({ name: b.name, score: score });
  });
  scored.sort(function(a, b){ return b.score - a.score; });
  if (!scored.length) {
    return S.branches.filter(function(b){ return b.name !== def; }).slice(0, 5).map(function(b){ return b.name; });
  }
  return scored.slice(0, 6).map(function(x){ return x.name; });
}

    body.innerHTML = '<div class="ax-tree-empty">先在顶部打开一个仓库。</div>';

function renderTreeLevel(node, depth){
  var items = sortedChildren(node);
  if (!items.length) return '';

    if (n.type === 'dir') {
      var open = !!S.expanded[n.path];
      var kids = sortedChildren(n);
      return '<button class="ax-tree-row" data-act="tree-dir" data-path="' + esc(n.path) + '" aria-expanded="' + (open ? 'true' : 'false') + '" role="treeitem">' +
          '<span class="tw ' + (open ? 'open' : '') + '">' + (kids.length ? ic('chevron-r') : '') + '</span>' +
          '<span class="ic">▸</span><span class="nm">' + esc(n.name) + '</span><span class="sz">' + kids.length + '</span></button>' +
        (open ? '<div class="ax-tree-children" role="group">' + renderTreeLevel(n, depth + 1) + '</div>' : '');
    }
    return '<button class="ax-tree-row ' + (S.path === n.path ? 'on' : '') + '" data-act="tree-file" data-path="' + esc(n.path) + '" role="treeitem">' +
      '<span class="tw"></span><span class="ic">' + extBadge(n.path) + '</span>' +
      '<span class="nm">' + esc(n.name) + '</span><span class="sz">' + fmtSize(n.size) + '</span>' +
      (isFileBookmarkedPath(n.path) ? '<span class="st">★</span>' : '') + '</button>';
  }).join('');
}

function debounce(fn, ms){
  var t = null, args = null, self = null;
  return function(){
    self = this; args = arguments;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(self, args); }, ms);
  };
}

  exs:'elixir',erl:'erlang',hs:'haskell'};

function isMobile(){ return !!(window.matchMedia && window.matchMedia('(max-width: 900px)').matches); }
function isMarkdown(path){ return MD_EXT.indexOf(extOf(path)) >= 0; }
function isTextLike(path){
  var e = extOf(path);
  if (isMarkdown(path)) return true;
  if (CODE_EXT.indexOf(e) >= 0) return true;
  if (!e) return baseOf(path).indexOf('.') < 0;
  return false;
}
function findTreeFile(path){
  for (var i = 0; i < S.tree.length; i++) if (S.tree[i].path === path) return S.tree[i];
  return null;
}
function safeDecode(s){
  try { return decodeURIComponent(s); } catch(e){ return s; }
}

/* ============================================================
   收藏
   ============================================================ */
function sameRepo(entry, owner, repo){
  return entry && entry.type === 'repo' &&
    String(entry.owner).toLowerCase() === String(owner || S.owner).toLowerCase() &&
    String(entry.repo).toLowerCase() === String(repo || S.repo).toLowerCase();
}
function isRepoBookmarked(owner, repo){
  owner = owner || S.owner; repo = repo || S.repo;
  if (!owner || !repo) return false;
  return bookmarks.some(function(b){ return sameRepo(b, owner, repo); });
}
function isFileBookmarkedPath(path, owner, repo, branch){
  if (!path) return false;
  owner = owner || S.owner; repo = repo || S.repo; branch = branch || S.branch;
  return bookmarks.some(function(b){
    return b.type === 'file' && b.owner === owner && b.repo === repo && b.branch === branch && b.path === path;
  });
}
function isFileBookmarked(){ return isFileBookmarkedPath(S.path); }

function saveBookmarks(){
  store.set(K.bookmarks, bookmarks);
  renderChrome();
  if (S.view === 'shelf') renderShelf();
  if (S.mobileView === 'shelf') renderMobileShelf();
}
function toggleRepoBookmark(owner, repo){
  owner = owner || S.owner; repo = repo || S.repo;
  if (!owner || !repo) { toast('先打开一个仓库', 'err'); return; }
  var idx = -1;
  bookmarks.forEach(function(b, i){ if (sameRepo(b, owner, repo)) idx = i; });
  if (idx >= 0) {
    bookmarks.splice(idx, 1);
    toast('已取消收藏 ' + owner + '/' + repo, 'info');
  } else {
    var m = (S.owner === owner && S.repo === repo) ? S.meta : null;
    bookmarks.unshift({
      type: 'repo', owner: owner, repo: repo,
      title: (m && m.name) || repo,
      desc: (m && m.description) || '',
      lang: (m && m.language) || '',
      stars: (m && m.stargazers_count) || 0,
      ts: Date.now()
    });
    toast('已收藏 ' + owner + '/' + repo, 'ok');
  }
  saveBookmarks();
}
function toggleFileBookmark(path){
  path = path || S.path;
  if (!S.owner || !path) { toast('先打开一个文件', 'err'); return; }
  var idx = -1;
  bookmarks.forEach(function(b, i){
    if (b.type === 'file' && b.owner === S.owner && b.repo === S.repo && b.branch === S.branch && b.path === path) idx = i;
  });
  if (idx >= 0) {
    bookmarks.splice(idx, 1);
    toast('已移除文件收藏', 'info');
  } else {
    bookmarks.unshift({
      type: 'file', owner: S.owner, repo: S.repo, branch: S.branch,
      path: path, title: baseOf(path), dir: dirOf(path), ts: Date.now()
    });
    toast('已收藏文件 ' + baseOf(path), 'ok');
  }
  saveBookmarks();
  renderTree();
  renderMobileFiles();
  renderOverview();
}

  var repos = bookmarks.filter(function(b){ return b.type === 'repo'; });

   ============================================================ */
function noteCount(){
  return Object.keys(notes).reduce(function(n, k){ return n + (notes[k] ? notes[k].length : 0); }, 0);
}
function parseFileKey(key){
  var at = key.indexOf('@');
  if (at < 0) return null;
  var repoPart = key.slice(0, at), rest = key.slice(at + 1);
  var sl = repoPart.indexOf('/');
  if (sl < 0) return null;
  var sp = rest.indexOf('/');
  if (sp < 0) return null;
  return {
    owner: repoPart.slice(0, sl), repo: repoPart.slice(sl + 1),
    branch: rest.slice(0, sp), path: rest.slice(sp + 1), key: key
  };
}
function applyNotesToRoot(root){
  if (!root || !S.owner || !S.path) return;
  var key = fileKey();
  var list = notes[key] || [];
  $$('mark.ax-hl', root).forEach(function(m){
    var p = m.parentNode;
    if (!p) return;
    while (m.firstChild) p.insertBefore(m.firstChild, m);
    p.removeChild(m);
    try { p.normalize(); } catch(e){}
  });
  list.forEach(function(n){
    if (!n.quote) return;
    try { highlightQuote(root, n); } catch(e){}
  });
}
function highlightQuote(root, note){
  var quote = note.quote;
  if (!quote) return false;
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function(node){
      if (!node.nodeValue || node.nodeValue.indexOf(quote) < 0) return NodeFilter.FILTER_REJECT;
      var par = node.parentNode;
      if (par && par.closest && par.closest('mark.ax-hl, pre, code, .ax-tr')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  var target = walker.nextNode();
  if (!target) return false;
  var idx = target.nodeValue.indexOf(quote);
  var range = document.createRange();
  range.setStart(target, idx);
  range.setEnd(target, idx + quote.length);
  var mark = document.createElement('mark');
  mark.className = 'ax-hl' + (note.note ? ' has-note' : '');
  mark.setAttribute('data-note-id', note.id);
  mark.setAttribute('data-act', 'note-mark');
  try { range.surroundContents(mark); return true; } catch(e){ return false; }
}
function reapplyNotes(){

}

/* ============================================================
   Markdown 与内容渲染
   ============================================================ */
function sanitizeHtml(raw){
  try {
    if (window.DOMPurify) {
      return DOMPurify.sanitize(raw, {
        ADD_ATTR: ['target', 'rel', 'align'],
        ALLOW_DATA_ATTR: false
      });
    }
  } catch(e){}
  return raw;
}
function mdToHtml(text, path){
  var src = String(text || '');
  if (window.marked && marked.parse) {
    try {
      marked.setOptions({ gfm: true, breaks: false, headerIds: false, mangle: false });
      return sanitizeHtml(marked.parse(src));
    } catch(e){}
  }
  return '<pre>' + esc(src) + '</pre>';
}
function plainMd(text){
  return String(text || '')
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/[*_~`>#]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function slugify(s){
  var out = String(s || '').toLowerCase()
    .replace(/[`~!@#$%^&*()+=\[\]{};:'",.<>/?\\|]/g, '')
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '')
    .slice(0, 64);
  return out || 'section';
}
function assignHeadingIds(root, prefix){
  var used = {};
  var out = [];
  $$('h1,h2,h3,h4', root).forEach(function(h){
    var text = h.textContent.replace(/\s+/g, ' ').trim();
    var slug = slugify(text);
    var n = used[slug] || 0;
    used[slug] = n + 1;
    if (n) slug = slug + '-' + n;
    var id = prefix + slug;
    h.id = id;
    h.setAttribute('data-slug', slug);
    out.push({ level: Number(h.tagName.charAt(1)), id: id, text: text, slug: slug });
  });
  return out;
}
function resolveRel(baseFile, rel){
  var clean = String(rel || '').split('#')[0].split('?')[0];
  clean = safeDecode(clean);
  if (clean.charAt(0) === '/') return normPath(clean.slice(1));
  return normPath(dirOf(baseFile) + '/' + clean);
}
function rawGithubUrl(path, ref){
  return 'https://raw.githubusercontent.com/' + S.owner + '/' + S.repo + '/' +
    String(ref || S.branch).split('/').map(encodeURIComponent).join('/') + '/' +
    String(path).split('/').map(encodeURIComponent).join('/');
}
function decorateLinks(root, filePath){
  if (!root) return;
  $$('img', root).forEach(function(img){
    var src = img.getAttribute('src') || '';
    if (!src || /^data:/i.test(src)) return;
    var solved = '';
    if (!/^(https?:)?\/\//i.test(src)) solved = resolveRel(filePath, src);
    if (solved) {
      img.setAttribute('data-rel', solved);
      img.src = rawUrl(solved, S.branch);
      img.setAttribute('data-fb', rawGithubUrl(solved, S.branch));
    }
    img.setAttribute('loading', 'lazy');
    img.setAttribute('decoding', 'async');
    img.addEventListener('error', function(){
      if (img.getAttribute('data-fb') && img.getAttribute('data-fb') !== img.src) {
        var fb = img.getAttribute('data-fb');
        img.removeAttribute('data-fb');
        img.src = fb;
        return;
      }
      var ph = document.createElement('div');
      ph.className = 'ax-img-missing';
      ph.textContent = '图片加载失败：' + (solved || src);
      if (img.parentNode) img.parentNode.replaceChild(ph, img);
    });
  });

  $$('a', root).forEach(function(a){
    var href = a.getAttribute('href') || '';
    if (!href) return;
    if (/^(mailto:|tel:|javascript:)/i.test(href)) return;
    if (href.charAt(0) === '#') {
      var slug = safeDecode(href.slice(1));
      var target = null;
      $$('[data-slug]', root).forEach(function(h){ if (h.getAttribute('data-slug') === slug) target = h; });
      if (target) {
        a.setAttribute('data-act', 'anchor');
        a.setAttribute('data-id', target.id);
        a.setAttribute('href', 'javascript:void(0)');
      } else {
        a.setAttribute('href', githubBlobUrl(filePath, S.branch) + href);
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
      }
      return;
    }
    if (/^(https?:)?\/\//i.test(href)) {
      if (href.indexOf('//') === 0) a.setAttribute('href', 'https:' + href);
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
      return;
    }
    var hash = '';
    var hi = href.indexOf('#');
    if (hi >= 0) { hash = href.slice(hi); href = href.slice(0, hi); }
    var targetPath = resolveRel(filePath, href);
    var inTree = S.tree.some(function(f){ return f.path === targetPath; });
    if (inTree || (extOf(targetPath) && !targetPath.endsWith('/'))) {
      a.setAttribute('data-act', 'open-file');
      a.setAttribute('data-path', targetPath);
      a.setAttribute('href', 'javascript:void(0)');
    } else {
      a.setAttribute('href', githubTreeUrl() + '/' + targetPath.split('/').map(encodeURIComponent).join('/'));
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
    }
  });
}
function codeLangOf(path, explicit){
  if (explicit) return explicit.toLowerCase().replace(/^language-/, '');
  var b = baseOf(path).toLowerCase();
  if (b === 'dockerfile') return 'dockerfile';
  if (b === 'makefile') return 'makefile';
  var e = extOf(path);
  return LANG_MAP[e] || e || '';
}
function decorateCode(root){
  if (!root) return;
  $$('pre', root).forEach(function(pre){
    if (pre.getAttribute('data-ax-code')) return;
    pre.setAttribute('data-ax-code', '1');
    var code = pre.querySelector('code');
    if (!code) return;
    var cls = (code.className || '').match(/language-([A-Za-z0-9_+-]+)/);
    var lang = cls ? cls[1] : (pre.getAttribute('data-lang') || '');
    lang = codeLangOf('', lang);
    var src = code.textContent || '';
    if (window.hljs && src.length < 220000) {
      try {
        var res = null;
        if (lang && hljs.getLanguage && hljs.getLanguage(lang)) {
          res = hljs.highlight(src, { language: lang, ignoreIllegals: true });
        } else if (!lang || lang === 'text' || lang === 'plain') {
          res = hljs.highlightAuto(src, ['bash','javascript','json','python','xml','css','markdown','yaml']);
        }
        if (res && res.value) {
          code.innerHTML = res.value;
          code.classList.add('hljs');
          if (res.language) lang = res.language;
        }
      } catch(e){}
    }

async function openFile(path, opts){
  opts = opts || {};
  if (!S.owner || !path) return;
  path = normPath(path);
  var token = ++S.fileToken;
  S.path = path;
  S.kind = 'file';
  S.text = '';
  S.fileHtml = '';
  S.outline = [];
  S.mOutline = [];
  S.translated = false;
  S.selText = '';
  S.fileToken = token;
  S.fileSize = (findTreeFile(path) || {}).size || null;

  writeHash();
  if (!isMobile()) {
    if (S.view !== 'files') showView('files');
  }
  revealTreeTo(path);
  renderTree();
  updateTreeActive();
  renderChrome();
  updateReaderBar();

  var d = $('#readerPaper');
  if (d && !opts.keep) d.innerHTML = '<div class="ax-loader"><i></i>正在读取 ' + esc(baseOf(path)) + '…</div>';
  if (isMobile()) {
    openMobileReader();
    var mp = $('#mReaderPaper');
    if (mp && !opts.keep) mp.innerHTML = '<div class="ax-loader"><i></i>正在读取…</div>';
    setMobileReaderHead();
  }

  var key = cacheKey(S.owner, S.repo, S.branch, path);
  var ext = extOf(path);

  try {
    if (IMAGE_EXT.indexOf(ext) >= 0) {
      if (token !== S.fileToken) return;
      showImageFile(path);
      return;
    }
    if (BINARY_EXT.indexOf(ext) >= 0) {
      if (token !== S.fileToken) return;
      showBinaryFile(path);
      return;
    }
    var file = findTreeFile(path);
    if (file && file.size != null && file.size > 7000000) {
      if (token !== S.fileToken) return;
      showFileError(path, '文件超过 7 MB，为节省流量未加载。请直接在 GitHub 或通过 ZIP 下载。');
      return;
    }
    var text = await fetchRaw(path, S.branch);
    if (token !== S.fileToken) return;
    cachePut(key, text);
    showTextFile(text);
  } catch(err){
    if (token !== S.fileToken) return;
    var c = cacheGet(key);
    if (c && c.text) {
      S.text = c.text;
      showTextFile(c.text, { offline: true, ts: c.ts });
      toast('网络读取失败，已显示离线副本', 'info', 3200);
    } else if (ext === 'svg') {
      try {
        var svg = await fetchRaw(path, S.branch);
        if (token !== S.fileToken) return;
        S.fileHtml = paperHeadHtml(path, findTreeFile(path)) + '<div class="ax-file-prose">' + sanitizeHtml(svg) + '</div>';
        paintPaper();
        setMobileReaderContent();
        if (isMobile()) openMobileReader();
      } catch(e2){
        showFileError(path, err.message);
      }
    } else {
      showFileError(path, err.message || '读取失败');
    }
  }
}

var LANG_LABEL = {'zh-CN':'中文','zh-TW':'繁体中文','en':'英语','ja':'日语','ko':'韩语','fr':'法语','de':'德语','es':'西班牙语','ru':'俄语'};
function updateTranslateButtons(){
  var a = $('#btnTrans'); if (a) a.classList.toggle('on', !!S.translated);
  var b = $('#mBtnTrans'); if (b) b.classList.toggle('on', !!S.translated);
}
async function gTranslate(text){
  var target = cfg.transTarget || 'zh-CN';
  var key = target + '|' + text;
  if (transCache[key]) return transCache[key];
  var endpoint = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' +
    encodeURIComponent(target) + '&dt=t&q=' + encodeURIComponent(text);
  var urls = [
    endpoint,
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(endpoint),
    'https://corsproxy.io/?url=' + encodeURIComponent(endpoint)
  ];
  var last = null;
  for (var i = 0; i < urls.length; i++) {
    try {
      var r = await fetchT(urls[i], { cache: 'no-cache' }, 10000);
      if (!r.ok) { last = new Error('HTTP ' + r.status); continue; }
      var txt = await r.text();
      var data = JSON.parse(txt);
      if (data && data[0] && typeof data[0] === 'object') {
        var out = data[0].map(function(x){ return x && x[0] ? x[0] : ''; }).join('');
        if (out) {
          transCache[key] = out;
          var ks = Object.keys(transCache);
          if (ks.length > 260) { ks.slice(0, ks.length - 220).forEach(function(k){ delete transCache[k]; }); }
          store.set(K.trans, transCache);
          return out;
        }
      }
      last = new Error('返回格式异常');
    } catch(e){ last = e; }
  }
  throw new Error('翻译服务不可用' + (last ? '（' + last.message + '）' : ''));
}
function collectTransBlocks(root){
  var list = [];
  if (!root) return list;
  var prose = root.querySelector('.ax-file-prose');
  if (!prose) return list;
  $$('p,li,h1,h2,h3,h4,blockquote', prose).forEach(function(el){
    if (el.closest('.ax-tr')) return;
    if (el.querySelector('p,li,h1,h2,h3,h4,blockquote')) return;
    var t = el.textContent.replace(/\s+/g, ' ').trim();
    if (t.length < 2 || t.length > 900) return;
    list.push({ el: el, text: t });
  });
  return list.slice(0, 70);
}
function insertTr(el, text){
  if (!el || !el.parentNode) return;
  var d = document.createElement('div');
  d.className = 'ax-tr';
  d.textContent = text;
  el.parentNode.insertBefore(d, el.nextSibling);
}
function clearTranslations(){
  $$('.ax-tr').forEach(function(el){ el.remove(); });
  $$('.ax-reader-note[data-tr]').forEach(function(el){ el.remove(); });
}
async function toggleTranslate(){
  if (S.trRunning) { toast('翻译正在进行中…', 'info'); return; }
  if (S.translated) {
    clearTranslations();
    S.translated = false;
    updateTranslateButtons();
    toast('已隐藏译文', 'info', 1600);
    return;
  }
  if (!S.owner || !S.path) { toast('先打开一份文件', 'err'); return; }
  if (!isTextLike(S.path) && !isMarkdown(S.path)) { toast('这份文件不支持翻译', 'err'); return; }
  S.translated = true;
  updateTranslateButtons();
  var roots = [$('#readerPaper'), $('#mReaderPaper')].filter(Boolean);
  var blocks = [];
  roots.forEach(function(r){ blocks = blocks.concat(collectTransBlocks(r)); });
  if (!blocks.length) {
    S.translated = false;
    updateTranslateButtons();
    toast('没有找到可翻译的正文段落', 'err');
    return;
  }
  var token = ++S.trToken;
  S.trRunning = true;
  toast('正在翻译为' + (LANG_LABEL[cfg.transTarget] || cfg.transTarget) + '…（' + blocks.length + ' 段）', 'info', 2200);
  var idx = 0, done = 0, failed = 0;
  async function worker(){
    while (idx < blocks.length && token === S.trToken) {
      var b = blocks[idx++];
      try {
        var tr = await gTranslate(b.text);
        if (token !== S.trToken) return;
        insertTr(b.el, tr);
        done++;
      } catch(e){
        failed++;
      }
    }
  }
  try {
    await Promise.all([worker(), worker(), worker()]);
  } catch(e){}
  if (token !== S.trToken) return;
  S.trRunning = false;
  if (done) {
    toast('翻译完成：' + done + ' 段' + (failed ? '，' + failed + ' 段失败' : ''), failed ? 'info' : 'ok', 2800);
  } else {
    clearTranslations();
    S.translated = false;
    updateTranslateButtons();
    toast('翻译失败，请检查网络或稍后再试', 'err', 3600);
  }
}

function branchListHtml(){
  if (S.branchLoading) return '<div class="ax-branch-empty">正在扫描分支…</div>';
  if (S.branchError && !S.branches.length) {
    return '<div class="ax-branch-empty">分支读取失败：' + esc(S.branchError) + '<br><button class="ax-btn sm" data-act="branch-reload">重试</button></div>';
  }
  if (!S.branches.length) {
    return '<div class="ax-branch-empty">没有读到分支。可能是 API 限流或网络问题。<br><button class="ax-btn sm" data-act="branch-reload">重新读取</button></div>';

  var def = (S.meta && S.meta.default_branch) || 'main';

  var list = S.branches.filter(function(b){ return !q || b.name.toLowerCase().indexOf(q) >= 0; });

  }
  list = list.slice().sort(function(a, b){
    if (a.name === def) return -1;

async function switchBranch(name){
  name = String(name || '').trim();
  if (!S.owner || !name) return;
  closeScrim('branchScrim');
  if (name === S.branch) {
    if (S.branchMissing) {
      S.branchMissing = '';
      renderChrome(); renderOverview(); renderMobileOverview(); renderTree(); renderMobileFiles(); writeHash();
    }
    return;
  }
  var prevPath = S.path;
  var prevBranch = S.branch;
  S.branch = name;
  S.branchMissing = '';
  S.branchQuery = '';
  S.path = ''; S.kind = ''; S.text = ''; S.loading = true;
  S.expanded = {}; S.mDir = ''; S.outline = []; S.translated = false; S.trMap = {};
  closeMobileReader(true);
  resetReader();
  renderChrome(); renderOverview(); renderMobileOverview(); renderTree(); renderMobileFiles();
  renderBranchSheet();
  toast('正在接入 ' + name + '…', 'info', 1600);
  var treeRes = await loadTree(S.owner, S.repo, name).catch(function(e){ return e; });
  if (treeRes instanceof Error) {
    S.loading = false;
    S.branch = prevBranch;
    S.branchMissing = name;
    toast('分支「' + name + '」读取失败：' + (treeRes.message || '未知错误'), 'err', 3600);
    renderChrome(); renderOverview(); renderMobileOverview(); renderTree(); renderMobileFiles(); renderBranchSheet(); writeHash();
    return;
  }
  await loadHeadCommit(name);
  S.loading = false;
  pushRecent(S.owner, S.repo, name);
  if (prevPath && S.tree.some(function(f){ return f.path === prevPath; })) {
    await openFile(prevPath, { silent: true });
  } else if (prevPath) {
    toast('「' + name + '」里没有 ' + prevPath + '，已回到概览', 'info', 2600);
  }
  renderChrome(); renderOverview(); renderMobileOverview(); renderTree(); renderMobileFiles();
  renderBranchSheet();
  writeHash();
  toast('已接入 ' + name + ' 分支', 'ok', 1600);
}

function runSearch(force){
  var q = (S.searchQuery || '').trim();
  updateSearchView();
  if (!q) { runRemoteSearch(''); return; }
  if (force || !S.searchResults || S.searchResultsQuery !== q) runRemoteSearch(q);
}
var searchToken = 0;
async function runRemoteSearch(q){
  S.searchError = '';
  if (!q) { S.searchResults = []; S.searchLoading = false; updateSearchView(); return; }
  var token = ++searchToken;
  S.searchLoading = true;
  updateSearchView();
  try {
    var data = await gh('/search/repositories?q=' + encodeURIComponent(q) + '&sort=stars&order=desc&per_page=14');
    if (token !== searchToken) return;
    S.searchResults = (data.items || []).map(function(r){
      r.owner = { login: (r.full_name || '').split('/')[0] };
      return r;
    });
    S.searchResultsQuery = q;
    S.searchLoading = false;
    updateSearchView();
  } catch(e){
    if (token !== searchToken) return;
    S.searchLoading = false;
    S.searchResults = [];
    S.searchError = e.status === 403 || e.status === 429
      ? 'GitHub 搜索接口限流（未登录 10 次/分钟）。稍等一等，或在设置中填入 Token。'
      : (e.message || '搜索失败');
    updateSearchView();
  }
}

function cacheRowsHtml(){
  var keys = Object.keys(cache).sort(function(a, b){ return (cache[b].ts || 0) - (cache[a].ts || 0); }).slice(0, 12);
  if (!keys.length) return '<div class="ax-sheet-tip">还没有缓存。打开文本文件后会自动写入。</div>';
  return keys.map(function(k){
    var info = parseFileKey(k);
    var label = info ? (info.owner + '/' + info.repo + ' · ' + info.path) : k;
    return '<div class="ax-cache-row"><span class="p" title="' + esc(label) + '">' + esc(label) + '</span>' +
      '<span>' + fmtSize((cache[k].text || '').length) + '</span><span>' + fmtDate(cache[k].ts, true) + '</span>' +
      '<button data-act="cache-del" data-key="' + esc(k) + '">删除</button></div>';
  }).join('');
}
function rangeRow(label, key, min, max, step, val, unit, hint){
  return '<div class="ax-set-row"><span class="lab">' + esc(label) + (hint ? '<small style="display:block;font-size:10.5px;color:var(--ink-4)">' + esc(hint) + '</small>' : '') + '</span>' +
    '<span class="ctl"><input class="ax-range" type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '" data-set="' + key + '">' +
    '<span class="val" data-out="' + key + '">' + val + esc(unit || '') + '</span></span></div>';
}

function saveTokenFrom(btn){
  var card = btn.closest ? btn.closest('.ax-set-card') : null;
  var input = card ? card.querySelector('.ax-token-input') : null;
  var tok = input ? input.value.trim() : '';
  cfg.token = tok;
  saveCfg();
  renderSettings();
  toast(tok ? 'Token 已保存' : 'Token 已清除', 'ok');
}
function exportData(){
  var payload = {
    app: 'github-repo-browser', version: 'ax-1', exportedAt: new Date().toISOString(),
    cfg: { theme: cfg.theme, fontSize: cfg.fontSize, lineHeight: cfg.lineHeight, width: cfg.width,
      offline: cfg.offline, autoReadme: cfg.autoReadme, codeWrap: cfg.codeWrap, transTarget: cfg.transTarget },
    bookmarks: bookmarks, notes: notes, recent: recent
  };
  try {
    var text = JSON.stringify(payload, null, 2);
    var blob = new Blob([text], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'juanzong-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1200);
    toast('备份已导出', 'ok');
  } catch(e){ toast('导出失败', 'err'); }
}
function importData(){
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.addEventListener('change', function(){
    var f = inp.files && inp.files[0];
    if (!f) { inp.remove(); return; }
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var data = JSON.parse(String(reader.result));
        if (data.cfg) { cfg = Object.assign({}, DEFAULTS, cfg, data.cfg); saveCfg(); }
        if (Array.isArray(data.bookmarks)) { bookmarks = data.bookmarks; store.set(K.bookmarks, bookmarks); }
        if (data.notes && typeof data.notes === 'object') { notes = data.notes; store.set(K.notes, notes); }
        if (Array.isArray(data.recent)) { recent = data.recent; store.set(K.recent, recent); }
        applyTheme(); applyReadingPrefs(); renderChrome(); renderSettings(); renderTree();
        renderOverview(); renderMobileOverview(); renderNotes(); renderShelf(); renderMobileShelf();
        toast('备份已导入', 'ok');
      } catch(e){ toast('文件不是有效的备份 JSON', 'err'); }
      inp.remove();
    };
    reader.readAsText(f);
  }, { once: true });
  inp.click();
}
function resetAll(){
  if (!confirm('恢复默认设置并清空收藏、批注、缓存与最近记录？此操作不可撤销。')) return;
  try {
    Object.keys(localStorage).forEach(function(k){ if (k.indexOf('ax:') === 0) localStorage.removeItem(k); });
  } catch(e){}
  location.reload();
}

function wrapCanvas(ctx, text, maxWidth, maxLines){
  var chars = String(text || '').split('');
  var lines = [], line = '';
  for (var i = 0; i < chars.length; i++) {
    var test = line + chars[i];
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = chars[i];
      if (lines.length >= (maxLines || 99)) break;
    } else {
      line = test;
    }
  }
  if (line && lines.length < (maxLines || 99)) lines.push(line);
  if (lines.length >= (maxLines || 99)) {
    var last = lines[lines.length - 1];
    while (last && ctx.measureText(last + '…').width > maxWidth) last = last.slice(0, -1);
    lines[lines.length - 1] = last + '…';
  }
  return lines;
}
function drawShareCard(){
  var cv = $('#shareCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  var title = S.path ? baseOf(S.path) : ((S.meta && S.meta.name) || S.repo || 'GitHub 仓库');
  var ownerLine = S.owner ? (S.owner + ' / ' + S.repo) : 'GitHub';
  var desc = S.path
    ? ('来自 ' + S.owner + '/' + S.repo + ' 的文件，分支 ' + S.branch + '。')
    : ((S.meta && S.meta.description) || '一个公开的 GitHub 仓库信号。');
  var url = shareUrl();
  var stats = S.meta ? [
    ['STARS', fmtNum(S.meta.stargazers_count)],
    ['FORKS', fmtNum(S.meta.forks_count)],
    ['ISSUES', fmtNum(S.meta.open_issues_count)]
  ] : [];

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#04120f';
  ctx.fillRect(0, 0, W, H);
  var grd = ctx.createRadialGradient(W * .84, 0, 40, W * .84, 0, W * .9);
  grd.addColorStop(0, 'rgba(57,224,196,.16)');
  grd.addColorStop(1, 'rgba(57,224,196,0)');
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(57,224,196,.10)'; ctx.lineWidth = 1;
  for (var gx = 44; gx < W; gx += 44) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
  for (var gy = 44; gy < H; gy += 44) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }
  ctx.strokeStyle = '#39e0c4'; ctx.lineWidth = 2;
  ctx.strokeRect(44, 44, W - 88, H - 88);
  ctx.strokeStyle = 'rgba(57,224,196,.32)'; ctx.lineWidth = 1;
  ctx.strokeRect(60, 60, W - 120, H - 120);
  ctx.fillStyle = 'rgba(57,224,196,.5)';
  for (var t = 0; t < 4; t++) {
    ctx.fillRect(44, 44 + t * 22, 16, 1);
    ctx.fillRect(W - 60, 44 + t * 22, 16, 1);
    ctx.fillRect(44, H - 45 - t * 22, 16, 1);
    ctx.fillRect(W - 60, H - 45 - t * 22, 16, 1);
  }

  /* 声呐信号环 */
  ctx.save();
  ctx.translate(142, 148);
  ctx.strokeStyle = '#39e0c4';
  [0, 18, 36, 54].forEach(function(r, i){
    ctx.globalAlpha = i === 0 ? 1 : .5 - i * .1;
    ctx.lineWidth = i === 0 ? 2 : 1;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
  });
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#39e0c4';
  ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(46, -42); ctx.strokeStyle = 'rgba(57,224,196,.55)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();

  ctx.fillStyle = '#39e0c4';
  ctx.font = '600 18px "JetBrains Mono",Consolas,monospace';
  ctx.fillText('SIGNAL LOCKED · GITHUB REPOSITORY', 224, 148);

  ctx.fillStyle = '#d8f2ed';
  ctx.font = '800 72px "Segoe UI","Space Grotesk","PingFang SC",sans-serif';
  var titleLines = wrapCanvas(ctx, title, 880, 3);
  var ty = 268;
  titleLines.forEach(function(line){ ctx.fillText(line, 92, ty); ty += 82; });

  ctx.fillStyle = '#39e0c4';
  ctx.font = '500 22px "JetBrains Mono",Consolas,monospace';
  ctx.fillText(ownerLine + (S.branch ? '  ·  ' + S.branch : ''), 96, ty + 6);
  ty += 48;

  ctx.fillStyle = '#a4cdc7';
  ctx.font = '400 29px "Segoe UI","PingFang SC",sans-serif';
  var descLines = wrapCanvas(ctx, desc, 880, 5);
  descLines.forEach(function(line){ ctx.fillText(line, 96, ty + 40); ty += 46; });
  ty += 28;

  if (S.meta && (S.meta.topics || []).length) {
    var tx = 96, chipY = ty + 10;
    ctx.font = '500 19px "JetBrains Mono",Consolas,monospace';
    S.meta.topics.slice(0, 5).forEach(function(topic){
      var tw = ctx.measureText('#' + topic).width + 26;
      if (tx + tw > W - 110) return;
      ctx.strokeStyle = 'rgba(57,224,196,.45)'; ctx.lineWidth = 1;
      ctx.strokeRect(tx, chipY, tw, 36);
      ctx.fillStyle = '#7fc7ee';
      ctx.fillText('#' + topic, tx + 13, chipY + 25);
      tx += tw + 12;
    });
    ty = chipY + 72;
  }

  if (stats.length) {
    var sy = Math.max(ty + 26, 760);
    ctx.strokeStyle = 'rgba(57,224,196,.28)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(92, sy); ctx.lineTo(W - 92, sy); ctx.stroke();
    stats.forEach(function(s, i){
      var sx = 96 + i * 300;
      ctx.fillStyle = '#d8f2ed'; ctx.font = '700 40px "JetBrains Mono",Consolas,monospace';
      ctx.fillText(s[1], sx, sy + 60);
      ctx.fillStyle = '#4b706b'; ctx.font = '500 15px "JetBrains Mono",Consolas,monospace';
      ctx.fillText(s[0], sx, sy + 88);
    });
    ty = sy + 116;
  }

  var by = 1150;
  ctx.strokeStyle = 'rgba(57,224,196,.28)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(92, by); ctx.lineTo(W - 92, by); ctx.stroke();
  ctx.fillStyle = '#6f9b95';
  ctx.font = '500 16px "JetBrains Mono",Consolas,monospace';
  var urlLines = wrapCanvas(ctx, url, 880, 2);
  urlLines.forEach(function(line, i){ ctx.fillText(line, 92, by + 42 + i * 26); });
  ctx.fillStyle = '#4b706b';
  ctx.font = '400 18px "Segoe UI","PingFang SC",sans-serif';
  ctx.fillText('声呐 · SIGNAL / 单文件 GitHub 仓库阅读器', 92, H - 74);
  ctx.textAlign = 'right';
  ctx.fillText(todayLabel(), W - 92, H - 74);
  ctx.textAlign = 'left';
}
function openShare(){
  drawShareCard();
  var tip = $('#shareTip');
  if (tip) tip.textContent = S.path ? ('分享这张卡片会带上文件路径 · ' + S.path) : '卡片在你的浏览器本地绘制，不会上传任何数据。';
  openScrim('shareScrim');
}
function downloadShare(){
  var cv = $('#shareCanvas');
  if (!cv) return;
  try {
    cv.toBlob(function(blob){
      if (!blob) { toast('生成图片失败', 'err'); return; }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'signal-' + (S.repo || 'github') + '-' + new Date().toISOString().slice(0, 10) + '.png';
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1200);
      toast('卡片已下载', 'ok');
    }, 'image/png');
  } catch(e){ toast('浏览器不支持导出画布', 'err'); }
}
function openQr(){
  var url = shareUrl();
  var img = $('#qrImg');
  var u = $('#qrUrl');
  if (u) u.textContent = url;
  if (img) img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=440x440&margin=8&data=' + encodeURIComponent(url);
  openScrim('qrScrim');
}

var PAL_SYMBOLS = {home:1,folder:1,bookmark:1,pen:1,search:1,settings:1,sun:1,moon:1,spark:1,refresh:1,
  down:1,share:1,more:1,star:1,globe:1,qr:1,copy:1,external:1,x:1,chev:1,back:1,list:1,clock:1,check:1,
  'chevron-r':1,github:1,branch:1,sonar:1};
function paletteIcon(name){
  if (PAL_SYMBOLS[name]) return ic(name);
  return esc(name || '·');
}
function paletteItem(icon, title, sub, hint, run, section){
  return { icon: icon, title: title, sub: sub || '', hint: hint || '', run: run, section: section || '' };
}
function paletteItemsFor(q){
  var items = [];
  var lower = (q || '').toLowerCase().trim();
  var p = lower ? parseRepoInput(q) : null;

  if (p) {
    items.push(paletteItem('bookmark', '打开仓库 ' + p.owner + '/' + p.repo, '直接读取公开仓库', '↵', function(){
      loadRepo(p.owner, p.repo, { branch: p.branch, path: p.path });
    }, '打开'));
  }

  var cmds = [
    paletteItem('folder', '打开仓库…', '输入 owner/repo 或粘贴 GitHub 链接', 'Ctrl O', openRepoSheet),
    paletteItem('search', '搜索 GitHub 仓库', '在当前页搜索公开仓库', 'Ctrl F', function(){
      if (isMobile()) openPalette(''); else { showView('search'); }
    }),
    paletteItem('refresh', '刷新当前仓库', '重新读取文件树与发行版', 'R', function(){ refreshRepo(); }),
    paletteItem('down', '下载仓库 ZIP', 'codeload.github.com', '', function(){ downloadZip(); }),
    paletteItem('branch', '切换分支', S.owner ? (S.branch + ' · ' + (S.branches.length || '—') + ' 个分支') : '先打开一个仓库', '', function(){ openBranchSheet(); }),
    paletteItem('share', '生成分享卡片', '1080×1350 PNG', '', function(){ openShare(); }),
    paletteItem('qr', '显示分享二维码', '扫码在手机上继续读', '', function(){ openQr(); }),
    paletteItem('star', isRepoBookmarked() ? '取消收藏当前仓库' : '收藏当前仓库', S.owner ? (S.owner + '/' + S.repo) : '先打开一个仓库', '', function(){ toggleRepoBookmark(); }),
    paletteItem('copy', '复制当前链接', '带深链的页面地址', '', function(){ copyWithToast(shareUrl(), '链接已复制'); }),
    paletteItem('settings', '打开设置', '主题、字号、Token、缓存', '', function(){
      if (isMobile()) { setMobileView('settings'); } else showView('settings');
    }),
    paletteItem('bookmark', '打开书架', '收藏的仓库与文件', '', function(){
      if (isMobile()) { setMobileView('shelf'); } else showView('shelf');
    }),
    paletteItem('pen', '打开批注', '笔记与高亮', '', function(){
      if (isMobile()) { setMobileView('notes'); } else showView('notes');
    }),
    paletteItem('sun', '切换明暗主题', '浅海 / 深海', 'T', function(){ toggleTheme(); }),
    paletteItem('spark', '键盘快捷键', '查看全部快捷键', '?', function(){ openKbdSheet(); })
  ];
  cmds.forEach(function(c){
    if (!lower || (c.title + ' ' + c.sub).toLowerCase().indexOf(lower) >= 0) {
      c.section = '命令';
      items.push(c);
    }
  });

  if (S.root && lower) {
    var files = (S.tree || []).filter(function(f){ return f.path.toLowerCase().indexOf(lower) >= 0; }).slice(0, 8);
    files.forEach(function(f){
      items.push(paletteItem(extBadge(f.path), baseOf(f.path), f.path, '文件', function(){ openFile(f.path); }, '文件'));
    });
  }
  if (lower) {
    recent.forEach(function(x){
      if ((x.owner + '/' + x.repo).toLowerCase().indexOf(lower) >= 0) {
        items.push(paletteItem('clock', '最近：' + x.owner + '/' + x.repo, x.branch || '', '最近', function(){
          loadRepo(x.owner, x.repo, { branch: x.branch });
        }, '最近'));
      }
    });
    items.push(paletteItem('search', '在 GitHub 搜索「' + q + '」', '按 Star 排序', '↵', function(){
      closeScrim('paletteScrim');
      if (isMobile()) { setMobileView('overview'); }
      showView('search');
      setTimeout(function(){ var s = $('#searchInput'); if (s) { s.value = q; S.searchQuery = q; runSearch(true); } }, 200);
    }, '搜索'));
  } else {

function renderPalette(){

    html += '<button class="ax-pal-item ' + (i === S.paletteSel ? 'sel' : '') + '" data-pal-index="' + i + '">' +

function openPalette(seed){
  var input = $('#paletteInput');
  if (!input) return;
  if (!input.getAttribute('data-bound')) {
    input.setAttribute('data-bound', '1');
    input.addEventListener('input', function(){
      S.paletteItems = paletteItemsFor(input.value);
      S.paletteSel = 0;
      renderPalette();
    });
    input.addEventListener('keydown', function(e){
      if (e.key === 'ArrowDown') { e.preventDefault(); S.paletteSel = Math.min(S.paletteSel + 1, S.paletteItems.length - 1); renderPalette(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); S.paletteSel = Math.max(S.paletteSel - 1, 0); renderPalette(); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        var it = S.paletteItems[S.paletteSel];
        if (it) { closeScrim('paletteScrim'); setTimeout(it.run, 80); }
      }
    });
  }
  input.value = seed || '';
  S.paletteItems = paletteItemsFor(seed || '');
  S.paletteSel = 0;
  renderPalette();
  openScrim('paletteScrim');
  setTimeout(function(){ input.focus(); }, 150);
}
function runPaletteIndex(i){
  var it = (S.paletteItems || [])[i];

}

/* ---------------- 阅读进度 ---------------- */
function updateProgress(){
  var sc = $('#readerScroll');
  var bar = $('#readerProgress');
  if (!sc || !bar) return;
  var max = sc.scrollHeight - sc.clientHeight;
  var pct = max > 0 ? Math.min(100, Math.max(0, sc.scrollTop / max * 100)) : 0;
  bar.style.width = pct.toFixed(1) + '%';
}
function updateMobileRing(pct){
  pct = pct == null ? 0 : pct;
  var fg = $('#mRingFg');
  var tx = $('#mRingTxt');
  var bar = $('#mReaderProgressBar');
  if (fg) fg.setAttribute('stroke-dashoffset', String(91 * (1 - pct / 100)));
  if (tx) tx.textContent = String(Math.round(pct));
  if (bar) bar.style.width = pct.toFixed(1) + '%';
}
function bindScrolls(){
  var rs = $('#readerScroll');
  if (rs) {
    rs.addEventListener('scroll', throttle(function(){ updateProgress(); refreshOutlineActive(); }, 80));
  }
  var ms = $('#mReaderScroll');
  if (ms) {
    ms.addEventListener('scroll', throttle(function(){
      var max = ms.scrollHeight - ms.clientHeight;
      updateMobileRing(max > 0 ? ms.scrollTop / max * 100 : 0);
    }, 60));
  }
}
function bindPullToRefresh(){
  var sc = $('#mScroll');
  if (!sc) return;
  var startY = null, pulled = 0, box = $('#mRefresh'), txt = $('#mRefreshText');
  sc.addEventListener('touchstart', function(e){
    if (sc.scrollTop <= 0 && e.touches && e.touches.length === 1) startY = e.touches[0].clientY;
    else startY = null;
  }, { passive: true });
  sc.addEventListener('touchmove', function(e){
    if (startY == null || !e.touches || e.touches.length !== 1) return;
    pulled = e.touches[0].clientY - startY;
    if (pulled > 8 && box) {
      box.classList.add('on');
      if (txt) txt.textContent = pulled > 62 ? '松开切换仓库' : '下拉切换仓库';
    }
  }, { passive: true });
  sc.addEventListener('touchend', function(){
    if (pulled > 62) openRepoSheet();
    pulled = 0; startY = null;
    if (box) box.classList.remove('on');
  });
}

function isEditable(el){
  if (!el) return false;
  var tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || !!el.isContentEditable;
}
function onSelectionChange(){
  var pill = $('#selPill');
  if (!pill) return;
  var sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) { pill.classList.remove('on'); return; }
  var text = sel.toString().trim();
  if (text.length < 2 || text.length > 320) { pill.classList.remove('on'); return; }
  var node = sel.anchorNode;
  var root = null;
  ['readerPaper', 'mReaderPaper'].forEach(function(id){
    var el = document.getElementById(id);
    if (el && node && el.contains(node)) root = el;
  });
  if (!root) { pill.classList.remove('on'); return; }
  S.selText = text;
  S.selScope = root.id;
  var rect = sel.getRangeAt(0).getBoundingClientRect();
  if (!rect || (!rect.width && !rect.height)) { pill.classList.remove('on'); return; }
  pill.classList.add('on');
  var w = pill.offsetWidth || 150;
  var x = Math.min(Math.max(rect.left + rect.width / 2, w / 2 + 8), window.innerWidth - w / 2 - 8);
  var y = rect.top - 46;
  if (y < 8) y = rect.bottom + 10;
  pill.style.left = (x - w / 2) + 'px';
  pill.style.top = y + 'px';
}

/* ---------------- 快捷键 ---------------- */
function onKeyDown(e){
  var meta = e.metaKey || e.ctrlKey;
  var k = (e.key || '').toLowerCase();
  if (meta && k === 'k') { e.preventDefault(); openPalette(); return; }
  if (meta && k === 'f') { e.preventDefault(); if (isMobile()) openPalette(); else { showView('search'); } return; }
  if (meta && k === 'o') { e.preventDefault(); openRepoSheet(); return; }
  if (isEditable(e.target) || e.altKey || meta) return;
  if (k === '/') {
    if (S.view === 'files') { e.preventDefault(); var tf = $('#treeFilter'); if (tf) tf.focus(); }
    return;
  }
  if (k === 't') { toggleTheme(); return; }
  if (k === 'r') { refreshRepo(); return; }
  if (e.key === '?') { openKbdSheet(); return; }
}

  var mRefresh = $('#mRefresh'); if (mRefresh) mRefresh.addEventListener('click', openRepoSheet);

  var refresh = $('#actRefresh'); if (refresh) refresh.addEventListener('click', refreshRepo);
  var zip = $('#actZip'); if (zip) zip.addEventListener('click', downloadZip);
  var bm = $('#actBookmark'); if (bm) bm.addEventListener('click', function(){ toggleRepoBookmark(); });
  var share = $('#actShare'); if (share) share.addEventListener('click', openShare);
  var gh = $('#actGithub'); if (gh) gh.addEventListener('click', function(){
    if (S.owner) window.open('https://github.com/' + S.owner + '/' + S.repo, '_blank', 'noopener');
  });
  var treeZip = $('#treeZip'); if (treeZip) treeZip.addEventListener('click', downloadZip);
  var treeRefresh = $('#treeRefresh'); if (treeRefresh) treeRefresh.addEventListener('click', refreshRepo);

  var treeFilter = $('#treeFilter');
  if (treeFilter) {
    treeFilter.addEventListener('input', debounce(function(){
      S.treeQuery = treeFilter.value;
      var pos = treeFilter.selectionStart;
      renderTree();
      var ni = $('#treeFilter');
      if (ni) { ni.focus(); try { ni.setSelectionRange(pos, pos); } catch(e){} }
    }, 180));
  }

  var btnTrans = $('#btnTrans'); if (btnTrans) btnTrans.addEventListener('click', toggleTranslate);
  var btnBmFile = $('#btnBookmarkFile'); if (btnBmFile) btnBmFile.addEventListener('click', function(){ toggleFileBookmark(); });
  var btnOutline = $('#btnOutline'); if (btnOutline) btnOutline.addEventListener('click', function(){
    S.showOutline = !S.showOutline;
    var layout = $('#fileLayout');
    if (layout) layout.classList.toggle('no-out', !S.showOutline);
    btnOutline.classList.toggle('on', !!S.showOutline);
    toast(S.showOutline ? '大纲已展开' : '大纲已收起', 'info', 1400);
  });
  var btnQr = $('#btnQrFile'); if (btnQr) btnQr.addEventListener('click', openQr);
  var btnShareF = $('#btnShareFile'); if (btnShareF) btnShareF.addEventListener('click', openShare);
  var btnMoreF = $('#btnFileMore'); if (btnMoreF) btnMoreF.addEventListener('click', openFileMore);

  var selAnno = $('#selAnno'); if (selAnno) selAnno.addEventListener('click', function(){ $('#selPill').classList.remove('on'); openAnnoSheet(); });
  var selCopy = $('#selCopy'); if (selCopy) selCopy.addEventListener('click', function(){
    $('#selPill').classList.remove('on');
    copyWithToast(S.selText || '', '已复制选中文字');
  });
  $('#annoSave') && $('#annoSave').addEventListener('click', saveAnno);
  $('#shareCopy') && $('#shareCopy').addEventListener('click', function(){ copyWithToast(shareUrl(), '链接已复制'); });
  $('#shareQr') && $('#shareQr').addEventListener('click', function(){ closeScrim('shareScrim'); setTimeout(openQr, 160); });
  $('#shareDownload') && $('#shareDownload').addEventListener('click', downloadShare);
  $('#qrCopy') && $('#qrCopy').addEventListener('click', function(){ copyWithToast(shareUrl(), '链接已复制'); });

  var mBack = $('#mReaderBack'); if (mBack) mBack.addEventListener('click', function(){ closeMobileReader(); });
  var mTitle = $('#mReaderTitleBtn'); if (mTitle) mTitle.addEventListener('click', openFileMore);
  var mTrans = $('#mBtnTrans'); if (mTrans) mTrans.addEventListener('click', toggleTranslate);
  var mBm = $('#mBtnBookmark'); if (mBm) mBm.addEventListener('click', function(){ toggleFileBookmark(); });
  var mAnno = $('#mBtnAnnotate'); if (mAnno) mAnno.addEventListener('click', openAnnoSheet);
  var mOut = $('#mBtnOutline'); if (mOut) mOut.addEventListener('click', openOutlineSheet);
  var mShare = $('#mBtnShare'); if (mShare) mShare.addEventListener('click', openShare);

  bindScrolls();
  bindPullToRefresh();

  document.addEventListener('click', onClick);
  document.addEventListener('input', onSettingInput);
  document.addEventListener('change', onSettingChange);
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('selectionchange', debounce(onSelectionChange, 70));
}

/* ---------------- 启动 ---------------- */
function boot(){
  bindAll();
  S.showOutline = true;
  var layout = $('#fileLayout');
  if (layout) layout.classList.remove('no-out');
  var mac = /Mac|iPhone|iPad/i.test(navigator.platform || '');
  var kbd = $('#mastKbd');
  if (kbd) kbd.textContent = mac ? '⌘K' : 'Ctrl K';
  var hash = parseHash();
  renderChrome();
  renderTree();
  renderMobileFiles();
  setMobileView('overview');
  if (hash && hash.owner && hash.repo) {
    var isRel = hash.kind === 'release';
    loadRepo(hash.owner, hash.repo, {
      branch: isRel ? '' : (hash.branch || ''),
      path: hash.path || '',
      release: isRel ? hash.branch : ''
    });
  } else {
    renderOverview();
    renderMobileOverview();
    resetReader();
    updateReadmeButtonStates();
    if (!isMobile()) setTimeout(function(){
      var entryInput = $$('.ax-entry-input').filter(function(x){ return x.offsetParent !== null; })[0];
      if (entryInput) { try { entryInput.focus({preventScroll:true}); } catch(e){} }
    }, 140);
  }
  renderRecents();
  window.addEventListener('resize', debounce(function(){
    if (!isMobile() && S.mReaderOpen) closeMobileReader(true);
  }, 200));
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
</body>
</html>
