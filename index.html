<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e7efec">
<title>声呐 · GitHub 仓库阅读器</title>
<meta name="description" content="单文件 GitHub 仓库浏览器：文件树、Markdown 阅读、分支切换、搜索、发行版、ZIP、分享卡片、批注、收藏、离线缓存与翻译。">
<style>
/* ============================================================
   SIGNAL / 声呐 — 深海声呐视觉语言
   浅海（light） / 深海（dark） · 网格、刻度、信号光
   一个强调色：信号青；全部界面围绕“接入—扫描—读取”展开
   ============================================================ */
:root{
  --paper:#e7efec;
  --paper-2:#dde8e4;
  --sheet:#f9fcfb;
  --sheet-2:#eef6f3;
  --sheet-3:#e2eeea;
  --line:#c4d8d3;
  --line-soft:#d9e7e2;
  --line-hard:#9dbcb4;
  --ink:#07211f;
  --ink-2:#1d403d;
  --ink-3:#4b6b67;
  --ink-4:#79928e;
  --red:#0a8578;
  --red-deep:#066a60;
  --red-soft:#cbeae4;
  --gold:#b07716;
  --green:#1d7a4d;
  --blue:#1f6b8a;
  --code-bg:#f0f7f4;
  --shade:rgba(7,33,31,.10);
  --shade-strong:rgba(7,33,31,.18);
  --ring:rgba(10,133,120,.28);
  --scrim:rgba(4,26,25,.5);
  --sans:"Space Grotesk","Segoe UI Variable Display","Segoe UI","Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Space Grotesk","Segoe UI Variable Display","Segoe UI","Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code","SFMono-Regular",Consolas,monospace;
  --rail-w:88px;
  --readw:760px;
  --fs-read:17px;
  --lh-read:1.85;
  --shadow-sheet:0 1px 0 rgba(255,255,255,.8) inset, 0 18px 44px -30px rgba(7,33,31,.45), 0 1px 3px rgba(7,33,31,.06);
  --shadow-pop:0 24px 70px -24px rgba(4,26,25,.4), 0 2px 10px rgba(4,26,25,.10);
  --ease:cubic-bezier(.2,.9,.25,1);
}
html[data-theme="ink"]{
  --paper:#03100f;
  --paper-2:#020c0b;
  --sheet:#071b1a;
  --sheet-2:#0a2422;
  --sheet-3:#0e2d2a;
  --line:#163936;
  --line-soft:#0f2b28;
  --line-hard:#245450;
  --ink:#d8f2ed;
  --ink-2:#a4cdc7;
  --ink-3:#6f9b95;
  --ink-4:#4b706b;
  --red:#39e0c4;
  --red-deep:#1ec0a6;
  --red-soft:#0b3532;
  --gold:#ffc46b;
  --green:#7fe0a0;
  --blue:#7fc7ee;
  --code-bg:#041413;
  --shade:rgba(0,0,0,.4);
  --shade-strong:rgba(0,0,0,.6);
  --ring:rgba(57,224,196,.32);
  --scrim:rgba(1,8,8,.72);
  --shadow-sheet:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 44px -26px rgba(0,0,0,.8);
  --shadow-pop:0 24px 70px -18px rgba(0,0,0,.8), 0 2px 10px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{height:100%;-webkit-text-size-adjust:100%}
html,body{margin:0}
body{
  height:100vh;height:100dvh;overflow:hidden;
  background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
  overflow-wrap:anywhere;
}
/* 海图网格 / 声呐深度场 */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:1;
  background-image:
    linear-gradient(rgba(10,133,120,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(10,133,120,.055) 1px,transparent 1px),
    radial-gradient(ellipse 70% 55% at 82% -8%,rgba(10,133,120,.13),transparent 68%);
  background-size:26px 26px,26px 26px,100% 100%;
  background-position:0 0,0 0,0 0;
}
html[data-theme="ink"] body::before{opacity:1;background-image:
  linear-gradient(rgba(57,224,196,.055) 1px,transparent 1px),
  linear-gradient(90deg,rgba(57,224,196,.045) 1px,transparent 1px),
  radial-gradient(ellipse 70% 55% at 82% -8%,rgba(57,224,196,.12),transparent 68%);}
::selection{background:var(--red-soft);color:var(--ink)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--line-hard);background-clip:padding-box}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
a{color:var(--red);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
img{max-width:100%}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}

/* ---------- 外框 ---------- */
.ax-frame{position:relative;z-index:1;display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100dvh;min-height:0}
.ax-rail{
  display:flex;flex-direction:column;align-items:stretch;gap:2px;
  padding:16px 9px 12px;border-right:1px solid var(--line);
  background:linear-gradient(180deg,var(--sheet) 0,var(--paper) 62%,var(--paper-2) 100%);
  position:relative;min-height:0;
}
.ax-rail::after{content:"";position:absolute;top:0;right:4px;bottom:0;width:1px;background:var(--line-soft);pointer-events:none}
.ax-seal{
  width:48px;height:48px;margin:0 auto 20px;flex:0 0 auto;
  display:grid;place-items:center;position:relative;
  color:var(--red);border:2px solid var(--red);border-radius:2px;
  font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.14em;
  transform:rotate(-2.5deg);
  background:var(--sheet);
  box-shadow:0 2px 0 var(--shade);
}
.ax-seal::before{content:"";position:absolute;inset:3px;border:1px solid var(--red);opacity:.55;border-radius:1px}
.ax-seal::after{content:"";position:absolute;inset:-6px;border:1px dashed var(--line-hard);opacity:.5;border-radius:3px}
.ax-rail-nav{display:flex;flex-direction:column;gap:2px}
.ax-rail-btn{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  min-height:54px;padding:6px 2px;border-radius:3px;
  color:var(--ink-3);font-size:11px;letter-spacing:.14em;line-height:1;
  transition:color .16s,background .16s;
}
.ax-rail-btn svg{width:19px;height:19px;display:block}
.ax-rail-btn:hover{color:var(--ink);background:var(--sheet-2)}
.ax-rail-btn.on{color:var(--red);background:var(--sheet)}
.ax-rail-btn.on::before{content:"";position:absolute;left:-9px;top:12px;bottom:12px;width:3px;background:var(--red)}
.ax-rail-spacer{flex:1}
.ax-rail-foot{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:8px}
.ax-rail-btn.slim{min-height:40px}
.ax-rail-btn.slim span{display:none}
.ax-rail-btn.slim svg{width:17px;height:17px;opacity:.85}

/* ---------- 主舞台 ---------- */
.ax-stage{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.ax-mast{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  min-height:62px;padding:9px 22px;padding-top:calc(9px + env(safe-area-inset-top,0px));
  border-bottom:1px solid var(--line);position:relative;z-index:5;
  background:linear-gradient(180deg,var(--sheet) 0,color-mix(in srgb,var(--sheet) 82%,transparent) 100%);
  backdrop-filter:blur(8px);
}
.ax-crumb{
  display:flex;align-items:center;gap:9px;min-width:0;max-width:44%;flex:0 1 auto;
  padding:5px 8px;margin-left:-8px;border-radius:3px;text-align:left;
  border:1px solid transparent;transition:background .15s,border-color .15s;
}
.ax-crumb:hover{background:var(--sheet-2);border-color:var(--line-soft)}
.ax-crumb .kicker{font-size:10px;letter-spacing:.2em;color:var(--ink-4);text-transform:uppercase;flex:0 0 auto}
.ax-crumb .name{font-family:var(--serif);font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.ax-crumb .name em{font-style:normal;color:var(--ink-3);font-weight:400;font-size:12px;font-family:var(--mono)}
.ax-crumb .chev{width:12px;height:12px;color:var(--ink-4);flex:0 0 auto}
.ax-mast-search{
  flex:0 1 420px;margin-left:auto;display:flex;align-items:center;gap:9px;
  height:36px;padding:0 12px;border:1px solid var(--line);border-radius:3px;
  background:var(--sheet);color:var(--ink-3);font-size:12.5px;text-align:left;
  transition:border-color .15s,box-shadow .15s;
}
.ax-mast-search:hover{border-color:var(--line-hard);color:var(--ink-2)}
.ax-mast-search svg{width:15px;height:15px;flex:0 0 auto;color:var(--ink-4)}
.ax-mast-search .kbd{margin-left:auto;flex:0 0 auto}
.ax-mast-act{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.ax-icon-btn{
  width:34px;height:34px;display:grid;place-items:center;border-radius:3px;
  color:var(--ink-3);border:1px solid transparent;position:relative;
  transition:background .15s,color .15s,border-color .15s;
}
.ax-icon-btn svg{width:17px;height:17px;display:block}
.ax-icon-btn:hover{background:var(--sheet-2);color:var(--ink);border-color:var(--line-soft)}
.ax-icon-btn.on{color:var(--red)}
.ax-icon-btn .dot{position:absolute;top:6px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--red)}
.ax-divider-v{width:1px;height:18px;background:var(--line);margin:0 4px;flex:0 0 auto}
.kbd{
  display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:19px;padding:0 5px;
  border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;background:var(--sheet);
  font-family:var(--mono);font-size:10px;color:var(--ink-4);letter-spacing:0;white-space:nowrap;
}

/* ---------- 视图容器 ---------- */
.ax-views{flex:1;min-height:0;position:relative;overflow:hidden}
.ax-view{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;padding:26px 26px 60px;display:none}
.ax-view.on{display:block}
.ax-view.flush{padding:0;overflow:hidden}
.ax-view-inner{max-width:1160px;margin:0 auto}
.ax-view-head{display:flex;align-items:flex-end;gap:14px;margin:4px 0 18px;padding-bottom:12px;border-bottom:3px double var(--line)}
.ax-view-head .no{font-family:var(--mono);font-size:11px;color:var(--ink-4);letter-spacing:.1em;padding-bottom:3px}
.ax-view-head h2{font-family:var(--serif);font-size:26px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
.ax-view-head .sub{flex:1;text-align:right;font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;padding-bottom:2px}
.ax-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  min-height:46vh;gap:10px;color:var(--ink-3);padding:30px;
}
.ax-empty .big{font-family:var(--serif);font-size:30px;color:var(--ink-2);letter-spacing:.04em}
.ax-empty .mark{width:64px;height:64px;border:1px dashed var(--line-hard);border-radius:50%;display:grid;place-items:center;color:var(--red);font-family:var(--serif);font-size:24px;margin-bottom:4px}
.ax-empty p{margin:0;font-size:12.5px;max-width:340px;line-height:1.7}

/* ---------- 控件 ---------- */
.ax-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:34px;padding:0 13px;border:1px solid var(--line-hard);border-radius:3px;
  background:var(--sheet);color:var(--ink);font-size:12.5px;font-weight:500;letter-spacing:.02em;
  box-shadow:0 1px 0 var(--shade);transition:background .14s,border-color .14s,transform .08s;
  white-space:nowrap;
}
.ax-btn svg{width:15px;height:15px}
.ax-btn:hover{background:var(--sheet-2);border-color:var(--ink-4)}
.ax-btn:active{transform:translateY(1px);box-shadow:none}
.ax-btn.solid{background:var(--red);border-color:var(--red-deep);color:#fff9f2}
.ax-btn.solid:hover{background:var(--red-deep)}
.ax-btn.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--ink-2)}
.ax-btn.ghost:hover{background:var(--sheet-2);border-color:var(--line-soft)}
.ax-btn.on{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.ax-btn.sm{min-height:28px;padding:0 9px;font-size:11.5px}
.ax-btn.lg{min-height:40px;padding:0 18px;font-size:13.5px}
.ax-btn[disabled]{opacity:.45;pointer-events:none}
.ax-chip{
  display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 9px;
  border:1px solid var(--line);border-radius:2px;background:var(--sheet-2);
  font-size:11px;color:var(--ink-2);letter-spacing:.04em;white-space:nowrap;
}
.ax-chip .n{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.ax-chip.red{color:var(--red);border-color:var(--red-soft);background:var(--red-soft)}
.ax-chip.gold{color:var(--gold);border-color:var(--line);background:var(--sheet-2)}
.ax-pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  background:var(--sheet-2);border:1px solid var(--line-soft);font-size:11px;color:var(--ink-2)
}
.ax-input,.ax-select,.ax-textarea{
  width:100%;min-width:0;min-height:36px;padding:7px 11px;
  border:1px solid var(--line);border-radius:3px;background:var(--sheet);color:var(--ink);
  font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s;
}
.ax-input::placeholder,.ax-textarea::placeholder{color:var(--ink-4)}
.ax-input:focus,.ax-select:focus,.ax-textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--ring)}
.ax-textarea{resize:vertical;min-height:84px;line-height:1.6}
.ax-select{appearance:none;padding-right:30px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%238a8272'><path d='M4.4 6.9l3.6 3.6 3.6-3.6'/></svg>");background-repeat:no-repeat;background-position:right 10px center;background-size:12px;cursor:pointer}
@media (max-width:900px){
  .ax-input,.ax-select,.ax-textarea{font-size:16px;min-height:42px}
}
.ax-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.ax-field > label{font-size:11px;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase}
.ax-field .hint{font-size:11.5px;color:var(--ink-3);line-height:1.55}
.ax-switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line-soft)}
.ax-switch:last-child{border-bottom:0}
.ax-switch .txt{font-size:13px}
.ax-switch .txt small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px;line-height:1.5}
.ax-toggle{position:relative;width:42px;height:24px;flex:0 0 auto;border-radius:99px;background:var(--line);border:1px solid var(--line-hard);transition:background .16s}
.ax-toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--sheet);box-shadow:0 1px 3px var(--shade);transition:transform .18s var(--ease);}
.ax-toggle.on{background:var(--red);border-color:var(--red-deep)}
.ax-toggle.on::after{transform:translateX(18px)}
.ax-seg{display:inline-flex;border:1px solid var(--line-hard);border-radius:3px;overflow:hidden;background:var(--sheet)}
.ax-seg button{min-height:32px;padding:0 12px;font-size:12px;color:var(--ink-3);border-right:1px solid var(--line)}
.ax-seg button:last-child{border-right:0}
.ax-seg button.on{background:var(--ink);color:var(--sheet);}
html[data-theme="ink"] .ax-seg button.on{background:var(--sheet-3);color:var(--ink)}
.ax-range{-webkit-appearance:none;width:100%;height:24px;background:transparent;cursor:pointer}
.ax-range::-webkit-slider-runnable-track{height:2px;background:var(--line-hard)}
.ax-range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-6px;border-radius:50%;background:var(--red);border:2px solid var(--sheet);box-shadow:0 0 0 1px var(--line-hard)}
.ax-range::-moz-range-track{height:2px;background:var(--line-hard)}
.ax-range::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid var(--sheet)}
/* ---------- 仓库概览 ---------- */
.ax-hero{
  position:relative;border:1px solid var(--line);background:var(--sheet);
  border-radius:3px;padding:26px 30px 22px;box-shadow:var(--shadow-sheet);overflow:hidden;
}
.ax-hero::before{
  content:"";position:absolute;left:0;right:0;top:0;height:4px;
  background:repeating-linear-gradient(90deg,var(--red) 0 24px,transparent 24px 30px,var(--line-hard) 30px 32px,transparent 32px 60px);
  opacity:.8;
}
.ax-hero::after{
  content:"";position:absolute;right:-26px;bottom:-40px;width:210px;height:210px;
  border:1px solid var(--line-soft);transform:rotate(14deg);pointer-events:none;
}
.ax-hero-top{display:flex;align-items:flex-start;gap:18px}
.ax-hero-main{min-width:0;flex:1}
.ax-hero .kicker{
  display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.26em;color:var(--ink-4);
  text-transform:uppercase;margin-bottom:6px;flex-wrap:wrap;
}
.ax-hero .kicker::before{content:"";width:18px;height:1px;background:var(--red)}
.ax-hero h1{
  margin:0 0 4px;font-family:var(--serif);font-size:clamp(30px,3.4vw,46px);
  line-height:1.08;font-weight:700;letter-spacing:-.015em;overflow-wrap:anywhere;
}
.ax-hero h1 .slash{color:var(--ink-4);font-weight:400;font-size:.55em;padding:0 6px;vertical-align:middle}
.ax-hero .owner{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.04em;margin-bottom:10px}
.ax-hero .desc{font-family:var(--serif);font-size:15.5px;line-height:1.75;color:var(--ink-2);margin:0 0 14px;max-width:72ch}
.ax-hero .topics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.ax-hero-actions{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.ax-hero-side{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:2px}
.ax-stamp{
  width:82px;height:82px;border:2px solid var(--red);color:var(--red);border-radius:2px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:16px;letter-spacing:.18em;line-height:1.3;
  transform:rotate(4deg);position:relative;background:transparent;
}
.ax-stamp::before{content:"";position:absolute;inset:4px;border:1px solid var(--red);opacity:.5}
.ax-stamp small{font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--ink-3);margin-top:2px}
.ax-stats{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--line-soft);margin-top:18px;padding-top:14px}
.ax-stat{padding:0 18px;border-right:1px solid var(--line-soft);min-width:88px}
.ax-stat:first-child{padding-left:0}
.ax-stat:last-child{border-right:0}
.ax-stat .n{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.1}
.ax-stat .l{font-size:10px;letter-spacing:.16em;color:var(--ink-4);text-transform:uppercase;margin-top:3px}
.ax-hero-alert{
  display:flex;align-items:center;gap:9px;margin-top:14px;padding:9px 12px;border:1px dashed var(--line-hard);
  background:var(--sheet-2);font-size:12px;color:var(--ink-2);border-radius:2px;
}
.ax-hero-alert b{color:var(--red);font-weight:600}
.ax-hero-alert svg{width:16px;height:16px;flex:0 0 auto;color:var(--red)}

/* ---------- 首页：接入信号 ---------- */
.ax-entry{max-width:920px;margin:0 auto;padding:clamp(8px,4.5vh,44px) 0 36px}
.ax-entry-deck{
  position:relative;overflow:hidden;isolation:isolate;
  background:var(--sheet);border:1px solid var(--line);border-radius:4px;
  padding:16px 26px 24px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,var(--shadow-sheet);
}
.ax-entry-deck::before{
  content:"";position:absolute;right:-150px;top:-150px;width:430px;height:430px;border-radius:50%;
  pointer-events:none;z-index:-1;
  background:repeating-radial-gradient(circle at center,transparent 0 38px,rgba(10,133,120,.14) 38px 39px,transparent 39px 78px);
}
html[data-theme="ink"] .ax-entry-deck::before{background:repeating-radial-gradient(circle at center,transparent 0 38px,rgba(57,224,196,.16) 38px 39px,transparent 39px 78px)}
.ax-entry-deck::after{
  content:"";position:absolute;right:-62px;top:-62px;width:270px;height:270px;border-radius:50%;
  pointer-events:none;z-index:-1;opacity:.5;animation:sg-sweep 16s linear infinite;
  background:conic-gradient(from 0deg,rgba(10,133,120,.26),rgba(10,133,120,0) 30%,rgba(10,133,120,0) 100%);
}
html[data-theme="ink"] .ax-entry-deck::after{background:conic-gradient(from 0deg,rgba(57,224,196,.3),rgba(57,224,196,0) 30%,rgba(57,224,196,0) 100%)}
.ax-entry-bar{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--ink-4)}
.ax-entry-bar .sig{display:flex;align-items:center;gap:7px;color:var(--red)}
.ax-entry-bar .sig b{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(10,133,120,.18);animation:sg-pulse 2.4s infinite}
.ax-entry-bar .clock{margin-left:auto;letter-spacing:.1em}
.ax-entry h1{position:relative;z-index:1;font-family:var(--sans);font-size:clamp(30px,3.6vw,46px);font-weight:800;letter-spacing:-.035em;line-height:1.02;margin:20px 0 4px}
.ax-entry h1 span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.32em;color:var(--red);font-weight:500;margin-bottom:10px}
.ax-entry-sub{position:relative;z-index:1;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink-4);margin-bottom:20px}
.ax-entry-field{position:relative;z-index:1;display:flex;align-items:flex-end;border-bottom:1px solid var(--line-hard);transition:border-color .2s}
.ax-entry-field::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .28s var(--ease);box-shadow:0 0 14px var(--red)}
.ax-entry-field:focus-within{border-color:var(--red)}
.ax-entry-field:focus-within::after{transform:scaleX(1)}
.ax-entry-field .lead{flex:0 0 auto;padding:0 14px 14px 0;font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--ink-4)}
.ax-entry-input{
  flex:1;min-width:0;height:54px;padding:0 4px 8px;border:0;background:transparent;outline:none;
  font-family:var(--sans);font-size:20px;font-weight:500;letter-spacing:-.01em;color:var(--ink);
}
.ax-entry-input::placeholder{color:var(--ink-4);font-weight:400;font-size:16.5px;letter-spacing:0}
.ax-entry-clip{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;margin:0 16px 10px 0;padding:0 0 3px;
  border-bottom:1px dashed var(--line-hard);color:var(--ink-3);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;white-space:nowrap;
  transition:color .15s,border-color .15s;
}
.ax-entry-clip svg{width:14px;height:14px}
.ax-entry-clip:hover{color:var(--red);border-color:var(--red)}
.ax-entry-go{
  flex:0 0 auto;height:46px;margin-bottom:4px;padding:0 22px;border-radius:2px;
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.2em;text-indent:.2em;
  background:var(--red);color:#04120f;box-shadow:0 8px 22px -14px var(--red);
  transition:background .16s,transform .16s;
}
.ax-entry-go:hover{background:var(--red-deep);transform:translateY(-1px)}
.ax-entry-status{position:relative;z-index:1;margin-top:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;line-height:1.7;color:var(--ink-3)}
.ax-entry-status b{color:var(--ink);font-weight:700}
.ax-entry-status.bad{color:#cf4a5c}
.ax-entry-help{position:relative;z-index:1;display:none;margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-left:2px solid var(--red);background:var(--paper-2);font-size:12px;line-height:1.75;color:var(--ink-2)}
.ax-entry-help.on{display:block}
.ax-entry-help b{color:var(--red)}
.ax-entry-help ol{margin:7px 0 11px;padding-left:20px}
.ax-entry-help li{margin:3px 0}
.ax-entry-help .row{display:flex;gap:8px;flex-wrap:wrap}
.ax-entry-log{position:relative;z-index:1;margin-top:22px;padding-top:2px}
.ax-entry-recent-hd{display:flex;align-items:center;gap:10px;margin-bottom:2px;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--ink-4)}
.ax-entry-recent-hd .t{color:var(--red);font-weight:700}
.ax-entry-recent-hd .sp{flex:1;height:1px;background:var(--line-soft)}
.ax-entry-recent-hd .more{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.04em}
.ax-entry-recent-hd .more:hover{color:var(--red)}
.ax-entry-list{counter-reset:sgrow;border-top:1px solid var(--line)}
.ax-entry-row{
  counter-increment:sgrow;display:flex;align-items:center;gap:12px;width:100%;min-width:0;
  padding:10px 8px 10px 0;text-align:left;border-bottom:1px solid var(--line-soft);
  transition:background .14s;
}
.ax-entry-row:hover{background:var(--sheet-2)}
.ax-entry-row::before{
  content:counter(sgrow,decimal-leading-zero);flex:0 0 auto;width:24px;
  font-family:var(--mono);font-size:10px;color:var(--ink-4);letter-spacing:.04em;
}
.ax-entry-row .tx{min-width:0;flex:1}
.ax-entry-row .tx b{display:block;font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ax-entry-row .tx small{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-4);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ax-entry-row .ar{flex:0 0 auto;font-family:var(--mono);font-size:11px;color:var(--ink-4);transition:color .14s,transform .14s}
.ax-entry-row:hover .ar{color:var(--red);transform:translateX(2px)}
.ax-entry-empty{padding:14px 2px;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;color:var(--ink-4)}
@keyframes sg-pulse{0%,100%{opacity:1;box-shadow:0 0 0 3px rgba(10,133,120,.16)}50%{opacity:.55;box-shadow:0 0 0 7px rgba(10,133,120,0)}}
@keyframes sg-sweep{to{transform:rotate(360deg)}}

.ax-block{margin-top:26px}
.ax-block-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.ax-block-head h3{font-family:var(--serif);font-size:19px;margin:0;font-weight:700;letter-spacing:.01em}
.ax-block-head .idx{font-family:var(--mono);font-size:10px;color:var(--ink-4)}
.ax-block-head .line{flex:1;height:1px;background:var(--line-soft);margin:0 2px}
.ax-block-head .act{font-size:11.5px;color:var(--red);background:none;border:0;padding:2px 4px}
.ax-grid-2{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
.ax-card{
  border:1px solid var(--line);background:var(--sheet);border-radius:3px;padding:16px 18px;
  box-shadow:var(--shadow-sheet);min-width:0;
}
.ax-card.flat{box-shadow:none;background:var(--sheet-2)}
.ax-card h4{margin:0 0 4px;font-family:var(--serif);font-size:16px;font-weight:700}
.ax-card .meta{font-size:11px;color:var(--ink-4);font-family:var(--mono)}
.ax-card .desc{font-size:12.5px;color:var(--ink-3);line-height:1.65;margin:6px 0 0}
.ax-mini-list{display:flex;flex-direction:column}
.ax-mini-item{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line-soft);min-width:0;text-align:left;width:100%}
.ax-mini-item:last-child{border-bottom:0}
.ax-mini-item .ic{width:26px;height:26px;border:1px solid var(--line);border-radius:2px;display:grid;place-items:center;flex:0 0 auto;color:var(--ink-3);font-size:12px;font-family:var(--mono)}
.ax-mini-item .tt{min-width:0;flex:1}
.ax-mini-item .tt b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ax-mini-item .tt small{display:block;font-size:10.5px;color:var(--ink-4);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ax-mini-item:hover{background:var(--sheet-2)}
.ax-mini-item .go{color:var(--ink-4);font-size:11px}
.ax-filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ax-filechip{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line-soft);
  background:var(--sheet);border-radius:2px;text-align:left;min-width:0;font-size:12px;
}
.ax-filechip:hover{background:var(--sheet-2);border-color:var(--line-hard)}
.ax-filechip .ic{font-family:var(--mono);font-size:10px;color:var(--red);width:18px;flex:0 0 auto;text-align:center}
.ax-filechip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ---------- 树 / 文件面板 ---------- */
.ax-file-layout{display:grid;grid-template-columns:298px minmax(0,1fr) 248px;height:100%;min-height:0}
.ax-file-layout.no-out{grid-template-columns:298px minmax(0,1fr)}
.ax-tree-pane{
  display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);
  background:linear-gradient(180deg,var(--paper) 0,var(--paper-2) 100%);
}
.ax-pane-head{padding:12px 12px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
.ax-tree-crumb{display:flex;align-items:center;gap:3px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-bottom:8px;line-height:1.6}
.ax-tree-crumb button{color:var(--ink-2);padding:1px 2px;font-family:var(--mono);font-size:10.5px}
.ax-tree-crumb button:hover{color:var(--red)}
.ax-tree-crumb .sep{color:var(--ink-4)}
.ax-pane-search{position:relative}
.ax-pane-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink-4);pointer-events:none}
.ax-pane-search input{padding-left:30px;height:32px;min-height:32px;font-size:12px}
.ax-pane-tools{display:flex;align-items:center;gap:6px;margin-top:8px}
.ax-pane-tools .count{font-size:10.5px;color:var(--ink-4);font-family:var(--mono);margin-left:auto}
.ax-tree{flex:1;overflow:auto;padding:6px 8px 40px;min-height:0}
.ax-tree-row{
  display:flex;align-items:center;gap:7px;width:100%;min-height:30px;padding:3px 6px 3px 4px;
  border-radius:2px;text-align:left;font-size:12.5px;color:var(--ink-2);min-width:0;position:relative;
}
.ax-tree-row:hover{background:var(--sheet-2);color:var(--ink)}
.ax-tree-row.on{background:var(--red-soft);color:var(--red-deep);font-weight:600}
.ax-tree-row.on::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:2px;background:var(--red)}
.ax-tree-row .tw{width:14px;height:14px;flex:0 0 auto;display:grid;place-items:center;color:var(--ink-4)}
.ax-tree-row .tw svg{width:11px;height:11px;transition:transform .16s}
.ax-tree-row .tw.open svg{transform:rotate(90deg)}
.ax-tree-row .ic{width:17px;flex:0 0 auto;font-family:var(--mono);font-size:9px;color:var(--gold);text-align:center;letter-spacing:-.03em}
.ax-tree-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ax-tree-row .sz{font-size:9.5px;color:var(--ink-4);font-family:var(--mono);flex:0 0 auto}
.ax-tree-row .st{font-size:10px;color:var(--gold);flex:0 0 auto}
.ax-tree-children{padding-left:13px}
.ax-tree-note{padding:10px 14px;font-size:11px;color:var(--ink-4);line-height:1.6}
.ax-tree-empty{padding:26px 14px;text-align:center;font-size:12px;color:var(--ink-4)}

/* 阅读器 */
.ax-reader-pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paper-2);position:relative}
.ax-reader-bar{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px;
  border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--sheet) 76%,var(--paper) 24%);
  min-height:48px;backdrop-filter:blur(6px);z-index:2;
}
.ax-reader-bar .path{flex:1;min-width:0;font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ax-reader-bar .path b{color:var(--ink);font-weight:600}
.ax-reader-bar .acts{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.ax-reader-progress{position:absolute;left:0;right:0;top:0;height:2px;background:transparent;z-index:3;pointer-events:none}
.ax-reader-progress i{display:block;height:2px;width:0;background:var(--red);transition:width .1s linear}
.ax-reader-scroll{flex:1;overflow:auto;min-height:0;scroll-behavior:smooth;overscroll-behavior:contain}
.ax-paper{
  max-width:var(--readw);margin:26px auto 60px;padding:44px 52px 54px;position:relative;
  background:var(--sheet);border:1px solid var(--line);border-radius:2px;
  box-shadow:var(--shadow-sheet);
  font-family:var(--serif);font-size:var(--fs-read);line-height:var(--lh-read);color:var(--ink-2);
}
.ax-paper::before{
  content:"";position:absolute;left:20px;top:0;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,var(--red-soft) 8%,var(--red-soft) 92%,transparent);opacity:.7;
}
.ax-paper-head{margin:-6px 0 22px;padding-bottom:14px;border-bottom:3px double var(--line)}
.ax-paper-head .kind{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--red);text-transform:uppercase;margin-bottom:6px}
.ax-paper-head h2{font-family:var(--serif);font-size:clamp(22px,2.4vw,30px);line-height:1.25;margin:0 0 6px;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.ax-paper-head .meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);display:flex;flex-wrap:wrap;gap:10px}
.ax-empty-reader{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:12px;color:var(--ink-3);text-align:center;padding:30px}
.ax-empty-reader .seal{width:74px;height:74px;border:2px dashed var(--line-hard);border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:23px;color:var(--ink-4)}
.ax-empty-reader .t{font-family:var(--serif);font-size:21px;color:var(--ink-2)}
.ax-empty-reader .s{font-size:12px;line-height:1.7;max-width:320px}

/* 大纲 */
.ax-outline-pane{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--paper)}
.ax-outline-head{flex:0 0 auto;padding:13px 15px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.ax-outline-head .t{font-family:var(--serif);font-size:13px;font-weight:700;letter-spacing:.08em}
.ax-outline-head .c{font-size:10px;color:var(--ink-4);font-family:var(--mono)}
.ax-outline{flex:1;overflow:auto;padding:8px 10px 40px;min-height:0}
.ax-outline a{
  display:block;padding:5px 8px;font-size:11.5px;line-height:1.45;color:var(--ink-3);border-left:2px solid transparent;
  text-decoration:none;border-radius:0 2px 2px 0;
}
.ax-outline a:hover{color:var(--ink);background:var(--sheet-2);text-decoration:none}
.ax-outline a.h2{padding-left:8px}
.ax-outline a.h3{padding-left:20px;font-size:11px;color:var(--ink-4)}
.ax-outline a.on{color:var(--red);border-left-color:var(--red);background:var(--sheet-2)}
.ax-outline .none{padding:18px 12px;font-size:11.5px;color:var(--ink-4);line-height:1.6;text-align:center}

/* ---------- Markdown 排版 ---------- */
.ax-prose{font-family:var(--serif);font-size:var(--fs-read);line-height:var(--lh-read);color:var(--ink-2);word-break:break-word}
.ax-prose > :first-child{margin-top:0}
.ax-prose h1,.ax-prose h2,.ax-prose h3,.ax-prose h4,.ax-prose h5{
  font-family:var(--serif);color:var(--ink);font-weight:700;line-height:1.35;letter-spacing:-.005em;
  margin:2em 0 .65em;scroll-margin-top:70px;
}
.ax-prose h1{font-size:1.9em;border-bottom:3px double var(--line);padding-bottom:.35em;margin-top:1.2em}
.ax-prose h2{font-size:1.5em;border-bottom:1px solid var(--line-soft);padding-bottom:.3em}
.ax-prose h3{font-size:1.24em}
.ax-prose h4{font-size:1.08em;letter-spacing:.02em}
.ax-prose p{margin:0 0 1.15em}
.ax-prose a{color:var(--red);text-decoration:none;border-bottom:1px solid var(--red-soft)}
.ax-prose a:hover{border-bottom-color:var(--red);text-decoration:none}
.ax-prose strong{color:var(--ink);font-weight:700}
.ax-prose em{font-style:italic}
.ax-prose ul,.ax-prose ol{margin:0 0 1.15em;padding-left:1.5em}
.ax-prose li{margin:.3em 0}
.ax-prose li > ul,.ax-prose li > ol{margin:.3em 0}
.ax-prose blockquote{
  margin:1.4em 0;padding:.6em 1.1em;border-left:3px solid var(--red);
  background:var(--sheet-2);color:var(--ink-3);font-style:italic;
}
.ax-prose blockquote p:last-child{margin-bottom:0}
.ax-prose hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.ax-prose table{width:100%;border-collapse:collapse;margin:1.3em 0;font-family:var(--sans);font-size:.8em;display:block;overflow:auto}
.ax-prose th,.ax-prose td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.ax-prose th{background:var(--sheet-2);font-weight:600;color:var(--ink)}
.ax-prose tr:nth-child(even) td{background:var(--sheet-2)}
.ax-prose img{border:1px solid var(--line);border-radius:2px;background:var(--sheet-2);max-width:100%;height:auto;display:block;margin:1.3em auto}
.ax-prose .ax-img-missing{border:1px dashed var(--line-hard);padding:22px;text-align:center;font-family:var(--sans);font-size:12px;color:var(--ink-4);margin:1.3em 0}
.ax-prose pre code{white-space:pre}
.ax-wrap-code .ax-prose pre code{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.ax-prose .task-list-item{list-style:none;margin-left:-1.3em}
.ax-prose input[type=checkbox]{margin-right:.5em;accent-color:var(--red)}
.ax-prose kbd{border:1px solid var(--line);border-bottom-width:2px;padding:1px 5px;border-radius:3px;background:var(--sheet-2);font-family:var(--mono);font-size:.78em}
.ax-prose code:not(pre code){
  font-family:var(--mono);font-size:.82em;background:var(--code-bg);border:1px solid var(--line-soft);
  padding:.1em .35em;border-radius:2px;color:var(--ink);overflow-wrap:anywhere;
}
.ax-prose pre{
  position:relative;margin:1.3em 0;border:1px solid var(--line);border-radius:3px;
  background:var(--code-bg);overflow:auto;font-size:13px;line-height:1.65;
}
.ax-prose pre code{display:block;padding:14px 16px;font-family:var(--mono);background:transparent;border:0;overflow-x:auto}
.ax-code-top{
  display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line-soft);
  background:var(--sheet-2);font-family:var(--mono);font-size:10px;color:var(--ink-4);letter-spacing:.08em;
}
.ax-code-top .lang{text-transform:uppercase;color:var(--ink-3)}
.ax-code-top .copy{margin-left:auto;font-size:10px;color:var(--ink-3);padding:2px 6px;border:1px solid var(--line-soft);border-radius:2px;background:var(--sheet);letter-spacing:.05em}
.ax-code-top .copy:hover{color:var(--red);border-color:var(--red-soft)}
.ax-prose .mermaid-fallback{border:1px dashed var(--line-hard);padding:14px;color:var(--ink-4);font-size:12px;font-family:var(--sans)}
/* 代码着色（自绘主题，不依赖外部样式表） */
.hljs{color:#3a3328;background:transparent}
html[data-theme="ink"] .hljs{color:#cfc8b9}
.hljs-comment,.hljs-quote{color:#8d8472;font-style:italic}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-doctag,.hljs-name{color:#9a3b2c}
.hljs-string,.hljs-regexp,.hljs-addition,.hljs-attribute{color:#3c6b45}
.hljs-number,.hljs-symbol,.hljs-bullet,.hljs-link{color:#87652a}
.hljs-function,.hljs-title,.hljs-section,.hljs-title.function_{color:#2b5672}
.hljs-type,.hljs-class,.hljs-built_in,.hljs-builtin-name{color:#6c4a78}
.hljs-variable,.hljs-template-variable,.hljs-params{color:#5c5142}
.hljs-attr,.hljs-property{color:#2b5672}
.hljs-meta,.hljs-selector-id,.hljs-selector-class{color:#8a6528}
.hljs-deletion{color:#a8362a}
html[data-theme="ink"] .hljs-comment,html[data-theme="ink"] .hljs-quote{color:#7c7568}
html[data-theme="ink"] .hljs-keyword,html[data-theme="ink"] .hljs-selector-tag,html[data-theme="ink"] .hljs-literal,html[data-theme="ink"] .hljs-name{color:#e08a76}
html[data-theme="ink"] .hljs-string,html[data-theme="ink"] .hljs-regexp,html[data-theme="ink"] .hljs-addition{color:#8fbf98}
html[data-theme="ink"] .hljs-number,html[data-theme="ink"] .hljs-symbol,html[data-theme="ink"] .hljs-attr{color:#d6b072}
html[data-theme="ink"] .hljs-function,html[data-theme="ink"] .hljs-title,html[data-theme="ink"] .hljs-property,html[data-theme="ink"] .hljs-built_in{color:#8fbcd9}
html[data-theme="ink"] .hljs-type,html[data-theme="ink"] .hljs-class{color:#b69acb}
html[data-theme="ink"] .hljs-variable,html[data-theme="ink"] .hljs-params{color:#cfc8b9}
/* 批注高亮 */
.ax-prose mark.ax-hl{
  background:linear-gradient(180deg,transparent 18%,var(--red-soft) 18%,var(--red-soft) 92%,transparent 92%);
  color:inherit;padding:0 1px;border-radius:1px;cursor:pointer;box-shadow:inset 0 -1px 0 var(--red);
}
.ax-prose mark.ax-hl.has-note{box-shadow:inset 0 -2px 0 var(--red)}
/* 译文块 */
.ax-prose .ax-tr{
  margin:-.4em 0 1.2em;padding:.55em .9em;border-left:2px solid var(--gold);
  background:var(--sheet-2);font-family:var(--sans);font-size:.78em;line-height:1.7;color:var(--ink-3);
}
.ax-prose .ax-tr::before{content:"译";font-family:var(--mono);font-size:9px;color:var(--gold);margin-right:8px;vertical-align:1px}
.ax-tr-hide .ax-tr{display:none}
.ax-reader-note{
  display:flex;align-items:center;gap:8px;margin:0 0 18px;padding:8px 12px;border:1px dashed var(--line-hard);
  background:var(--sheet-2);font-family:var(--sans);font-size:11.5px;color:var(--ink-3);border-radius:2px;
}
.ax-reader-note b{color:var(--red);font-weight:600}

/* ---------- 发行版 ---------- */
.ax-rel{border:1px solid var(--line);background:var(--sheet);border-radius:3px;padding:14px 18px;margin-bottom:10px}
.ax-rel:hover{border-color:var(--line-hard)}
.ax-rel-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ax-rel-top .tag{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--red)}
.ax-rel-top .nm{font-family:var(--serif);font-size:15px;font-weight:700}
.ax-rel-top .date{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}
.ax-rel-body{font-size:12.5px;line-height:1.7;color:var(--ink-3);margin:8px 0 0;white-space:pre-wrap;max-height:4.8em;overflow:hidden;position:relative}
.ax-rel-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ax-rel-asset{font-family:var(--mono);font-size:11px}

/* ---------- 收藏 / 批注 / 搜索 / 设置 ---------- */
.ax-shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ax-shelf-card{
  border:1px solid var(--line);background:var(--sheet);border-radius:3px;padding:14px 15px;
  display:flex;flex-direction:column;gap:5px;text-align:left;min-width:0;position:relative;
  box-shadow:var(--shadow-sheet);
}
.ax-shelf-card:hover{border-color:var(--line-hard);transform:translateY(-1px);transition:transform .12s}
.ax-shelf-card .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--red);text-transform:uppercase}
.ax-shelf-card .tt{font-family:var(--serif);font-size:15px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.ax-shelf-card .pth{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ax-shelf-card .ft{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line-soft);font-size:10.5px;color:var(--ink-4)}
.ax-shelf-card .ft .rm{margin-left:auto;color:var(--ink-3);border:1px solid transparent;border-radius:2px;padding:1px 5px}
.ax-shelf-card .ft .rm:hover{color:var(--red);border-color:var(--red-soft)}
.ax-notes-list{display:flex;flex-direction:column;gap:10px}
.ax-note-card{border:1px solid var(--line);background:var(--sheet);border-radius:3px;padding:13px 16px;position:relative}
.ax-note-card .quote{font-family:var(--serif);font-size:13px;line-height:1.7;color:var(--ink-3);border-left:3px solid var(--red-soft);padding-left:10px;margin-bottom:7px}
.ax-note-card .note{font-size:13px;line-height:1.7;color:var(--ink)}
.ax-note-card .meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-family:var(--mono);font-size:10px;color:var(--ink-4);flex-wrap:wrap}
.ax-note-card .meta .sp{flex:1}
.ax-note-card .meta button{font-size:10.5px;padding:2px 6px;border:1px solid var(--line-soft);border-radius:2px;color:var(--ink-3)}
.ax-note-card .meta button:hover{color:var(--red);border-color:var(--red-soft)}
.ax-note-group{margin-bottom:20px}
.ax-note-group h4{margin:0 0 10px;font-family:var(--serif);font-size:15px}
.ax-search-box{display:flex;gap:8px;margin-bottom:16px}
.ax-search-box .ax-input{height:44px;min-height:44px;font-size:15px;font-family:var(--serif)}
.ax-result{
  display:flex;gap:13px;padding:14px 6px;border-bottom:1px solid var(--line-soft);text-align:left;width:100%;
}
.ax-result:hover{background:var(--sheet-2)}
.ax-result .av{width:34px;height:34px;flex:0 0 auto;border:1px solid var(--line);border-radius:2px;background:var(--sheet-2);display:grid;place-items:center;font-family:var(--serif);font-size:15px;color:var(--ink-3)}
.ax-result .body{min-width:0;flex:1}
.ax-result .nm{font-family:var(--serif);font-size:15.5px;font-weight:700;line-height:1.3}
.ax-result .nm em{font-style:normal;font-weight:400;color:var(--ink-3);font-size:12px;font-family:var(--mono)}
.ax-result .ds{font-size:12px;color:var(--ink-3);line-height:1.6;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ax-result .mt{display:flex;gap:12px;margin-top:6px;font-size:10.5px;color:var(--ink-4);font-family:var(--mono);flex-wrap:wrap}
.ax-suggest{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 20px}
.ax-settings{max-width:760px}
@media (min-width:1180px){
  .ax-settings{max-width:none;column-count:2;column-gap:18px}
  .ax-set-card{break-inside:avoid}
}
.ax-set-card{border:1px solid var(--line);background:var(--sheet);border-radius:3px;padding:18px 22px;margin-bottom:16px;box-shadow:var(--shadow-sheet)}
.ax-set-card h3{margin:0 0 4px;font-family:var(--serif);font-size:17px}
.ax-set-card .sub{font-size:11.5px;color:var(--ink-3);margin-bottom:12px}
.ax-set-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line-soft);flex-wrap:wrap}
.ax-set-row:last-child{border-bottom:0}
.ax-set-row .lab{min-width:148px;font-size:12.5px;color:var(--ink-2)}
.ax-set-row .ctl{flex:1;min-width:170px;display:flex;align-items:center;gap:8px}
.ax-set-row .val{font-family:var(--mono);font-size:11px;color:var(--ink-4);min-width:40px;text-align:right}
.ax-cache-list{max-height:210px;overflow:auto;border:1px solid var(--line-soft);border-radius:2px;margin-top:10px}
.ax-cache-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px dashed var(--line-soft);font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.ax-cache-row:last-child{border-bottom:0}
.ax-cache-row .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ax-cache-row button{color:var(--red);font-size:10.5px;padding:1px 5px}
.ax-kbd-table{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 20px;margin-top:8px}
.ax-kbd-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dotted var(--line-soft);font-size:12px}
/* ---------- 浮层：命令面板 / 抽屉 / 分享 ---------- */
.ax-scrim{
  position:fixed;inset:0;z-index:80;background:var(--scrim);display:flex;
  opacity:0;pointer-events:none;transition:opacity .2s;
  backdrop-filter:blur(2px);
}
.ax-scrim.on{opacity:1;pointer-events:auto}
/* 命令面板 */
.ax-scrim.palette{align-items:flex-start;justify-content:center;padding:9vh 16px 0}
.ax-palette{
  width:min(660px,100%);max-height:72vh;display:flex;flex-direction:column;min-height:0;
  background:var(--sheet);border:1px solid var(--line-hard);border-radius:4px;
  box-shadow:var(--shadow-pop);transform:translateY(-8px);transition:transform .2s var(--ease);
  overflow:hidden;
}
.ax-scrim.on .ax-palette{transform:none}
.ax-palette-top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ax-palette-top svg{width:17px;height:17px;color:var(--red);flex:0 0 auto}
.ax-palette-top input{flex:1;border:0;background:transparent;outline:none;font-size:16px;font-family:var(--serif);color:var(--ink);min-width:0}
.ax-palette-top input::placeholder{color:var(--ink-4)}
.ax-palette-top .esc{flex:0 0 auto}
.ax-palette-list{flex:1;overflow:auto;padding:6px;min-height:0}
.ax-pal-item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:2px;text-align:left;color:var(--ink-2)}
.ax-pal-item .ic{width:22px;height:22px;display:grid;place-items:center;flex:0 0 auto;color:var(--ink-3);font-size:15px}
.ax-pal-item .ic svg{width:18px;height:18px}
.ax-pal-item .tt{flex:1;min-width:0}
.ax-pal-item .tt b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ax-pal-item .tt small{display:block;font-size:10.5px;color:var(--ink-4);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ax-pal-item .hint{font-size:10px;color:var(--ink-4);font-family:var(--mono);flex:0 0 auto}
.ax-pal-item.sel{background:var(--red-soft);color:var(--ink)}
.ax-pal-item.sel .ic{color:var(--red)}
.ax-pal-empty{padding:26px 18px;text-align:center;color:var(--ink-4);font-size:12.5px;line-height:1.7}
.ax-pal-section{padding:9px 11px 4px;font-size:9.5px;letter-spacing:.2em;color:var(--ink-4);text-transform:uppercase}
.ax-pal-foot{display:flex;align-items:center;gap:12px;padding:8px 14px;border-top:1px solid var(--line);background:var(--sheet-2);font-size:10.5px;color:var(--ink-4);flex-wrap:wrap}
.ax-pal-foot .sp{flex:1}
.ax-pal-foot span{display:inline-flex;align-items:center;gap:5px}
/* 抽屉 */
.ax-scrim.sheet{align-items:flex-end;justify-content:center}
.ax-sheet{
  width:100%;max-height:88dvh;display:flex;flex-direction:column;min-height:0;
  background:var(--sheet);border-radius:14px 14px 0 0;box-shadow:var(--shadow-pop);
  transform:translateY(30px);transition:transform .24s var(--ease);overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.ax-scrim.on .ax-sheet{transform:none}
.ax-sheet-head{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;border-bottom:1px solid var(--line-soft);flex:0 0 auto}
.ax-sheet-head .grab{display:none}
.ax-sheet-head h3{margin:0;font-family:var(--serif);font-size:18px;flex:1;line-height:1.3}
.ax-sheet-head .sub{font-size:10.5px;color:var(--ink-4);font-family:var(--mono)}
.ax-sheet-close{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line-soft);border-radius:2px;color:var(--ink-3);flex:0 0 auto}
.ax-sheet-close svg{width:15px;height:15px}
.ax-sheet-close:hover{color:var(--red);border-color:var(--red-soft)}
.ax-sheet-body{padding:16px 18px 24px;overflow:auto;min-height:0}
.ax-sheet-foot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line-soft);flex-wrap:wrap;flex:0 0 auto}
.ax-sheet-foot .ax-btn{flex:1}
@media (min-width:901px){
  .ax-scrim.sheet{align-items:center;justify-content:center;padding:40px 20px}
  .ax-sheet{max-width:560px;max-height:80vh;border-radius:4px;transform:translateY(-8px) scale(.98)}
  .ax-scrim.on .ax-sheet{transform:none}
}
/* 分享卡片 */
.ax-share-preview{
  display:block;width:100%;max-width:420px;margin:0 auto 14px;border:1px solid var(--line-hard);
  border-radius:2px;box-shadow:0 14px 34px -20px rgba(40,30,15,.6);background:var(--sheet-2);
}
.ax-qr-box{display:flex;flex-direction:column;align-items:center;gap:12px;padding:4px 0}
.ax-qr-img{width:220px;height:220px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:2px;image-rendering:auto}
.ax-qr-url{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);word-break:break-all;text-align:center;max-width:100%;line-height:1.55}
.ax-note-quote{font-family:var(--serif);font-size:13px;line-height:1.7;color:var(--ink-3);border-left:3px solid var(--red);padding:6px 0 6px 12px;margin-bottom:14px;max-height:120px;overflow:auto}
.ax-sheet-tip{font-size:11px;color:var(--ink-4);line-height:1.6;margin-top:10px}
.ax-repo-sheet .ax-input{height:44px;min-height:44px;font-size:15px}
.ax-recent-list{display:flex;flex-direction:column;margin-top:14px}
.ax-recent-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px dashed var(--line-soft);text-align:left;width:100%}
.ax-recent-row:last-child{border-bottom:0}
.ax-recent-row:hover{background:var(--sheet-2)}
.ax-recent-row .seal-mini{width:26px;height:26px;border:1px solid var(--line-hard);border-radius:2px;display:grid;place-items:center;color:var(--red);font-family:var(--serif);font-size:12px;flex:0 0 auto}
.ax-recent-row .tt{flex:1;min-width:0;font-size:12.5px}
.ax-recent-row .tt small{display:block;font-size:10.5px;color:var(--ink-4);font-family:var(--mono)}
.ax-recent-row .x{color:var(--ink-4);font-size:11px;padding:3px 5px}
.ax-recent-row .x:hover{color:var(--red)}
.ax-sheet-tabs{display:flex;gap:0;border-bottom:1px solid var(--line);padding:0 18px;flex:0 0 auto}
.ax-sheet-tabs button{padding:10px 14px;font-size:12px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.ax-sheet-tabs button.on{color:var(--red);border-bottom-color:var(--red);font-weight:600}
/* 浮动选词按钮 */
.ax-sel-pill{
  position:fixed;z-index:90;display:none;align-items:center;gap:6px;padding:3px;
  background:var(--ink);color:var(--sheet);border-radius:3px;box-shadow:0 6px 18px rgba(0,0,0,.3);
  font-size:12px;
}
.ax-sel-pill.on{display:flex}
.ax-sel-pill button{padding:5px 9px;color:var(--sheet);font-size:12px;border-radius:2px;display:flex;align-items:center;gap:5px}
.ax-sel-pill button:hover{background:rgba(255,255,255,.16)}
.ax-sel-pill .sep{width:1px;height:16px;background:rgba(255,255,255,.22)}
/* 提示条 */
.ax-toasts{position:fixed;left:20px;bottom:20px;z-index:95;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px));pointer-events:none}
.ax-toast{
  background:var(--ink);color:var(--sheet);border-radius:3px;padding:10px 14px;font-size:12.5px;line-height:1.55;
  box-shadow:0 10px 26px rgba(0,0,0,.28);display:flex;align-items:flex-start;gap:9px;
  animation:axToastIn .2s var(--ease);pointer-events:auto;
}
.ax-toast .ic{color:var(--gold);flex:0 0 auto}
.ax-toast .ic svg{width:16px;height:16px}
.ax-toast.err .ic{color:#ffb3a7}
.ax-toast.ok .ic{color:#a8d8b4}
@keyframes axToastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 加载骨架 */
.ax-skel{position:relative;overflow:hidden;background:var(--sheet-2);border:1px solid var(--line-soft);border-radius:2px}
.ax-skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:axShimmer 1.4s infinite}
html[data-theme="ink"] .ax-skel::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}
@keyframes axShimmer{to{transform:translateX(100%)}}
.ax-loader{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--ink-3);font-family:var(--mono);padding:10px 2px}
.ax-loader i{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:axSpin .7s linear infinite;display:inline-block}
@keyframes axSpin{to{transform:rotate(360deg)}}
.ax-banner{
  display:flex;align-items:flex-start;gap:10px;padding:11px 14px;margin-bottom:16px;
  border:1px solid var(--line);border-left:3px solid var(--gold);background:var(--sheet-2);
  font-size:12px;line-height:1.65;color:var(--ink-2);border-radius:0 2px 2px 0;
}
.ax-banner.bad{border-left-color:var(--red)}
.ax-banner b{color:var(--red)}
.ax-banner .x{margin-left:auto;color:var(--ink-4);flex:0 0 auto}

/* ============================================================
   移动端独立骨架
   ============================================================ */
.ax-m{display:none;position:fixed;inset:0;z-index:1;flex-direction:column;background:var(--paper);height:100dvh}
.ax-m-head{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:calc(9px + env(safe-area-inset-top,0px)) 14px 9px;
  border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--sheet) 88%,transparent);backdrop-filter:blur(12px);
  position:relative;z-index:10;
}
.ax-m-seal{width:34px;height:34px;border:1.5px solid var(--red);border-radius:2px;display:grid;place-items:center;color:var(--red);font-family:var(--serif);font-size:14px;flex:0 0 auto;transform:rotate(-2deg)}
.ax-m-repo{
  flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:5px 8px;
  border:1px solid var(--line-soft);border-radius:3px;background:var(--sheet);
  min-height:38px;text-align:left;
}
.ax-m-repo .n{min-width:0;flex:1}
.ax-m-repo b{display:block;font-family:var(--serif);font-size:13.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ax-m-repo small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ax-m-repo svg{width:12px;height:12px;color:var(--ink-4);flex:0 0 auto}
.ax-m-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:3px;color:var(--ink-3);flex:0 0 auto}
.ax-m-icon:active{background:var(--sheet-2)}
.ax-m-icon svg{width:19px;height:19px}
.ax-m-scroll{flex:1;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;min-height:0;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.ax-m-section{display:none}
.ax-m-section.on{display:block}
.ax-m-inner{padding:16px 16px 20px}
.ax-m-pad{padding:0 16px}
.ax-m-dock{
  position:absolute;left:0;right:0;bottom:0;z-index:12;
  display:grid;grid-template-columns:repeat(5,1fr);gap:0;
  padding:5px 8px calc(6px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--sheet) 92%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
}
.ax-m-dock button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 3px;color:var(--ink-3);font-size:10.5px;letter-spacing:.06em;border-radius:3px;min-height:48px;justify-content:center}
.ax-m-dock button svg{width:21px;height:21px}
.ax-m-dock button.on{color:var(--red)}
.ax-m-fab{
  position:absolute;right:14px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:13;
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  background:var(--ink);color:var(--sheet);box-shadow:0 10px 24px rgba(0,0,0,.25);
  border:1px solid var(--line-hard);
}
html[data-theme="ink"] .ax-m-fab{background:var(--red);color:#fff;border-color:var(--red-deep)}
.ax-m-fab svg{width:21px;height:21px}
.ax-m-fab:active{transform:scale(.94)}
.ax-m-refresh{
  display:flex;align-items:center;justify-content:center;gap:7px;height:0;overflow:hidden;
  font-size:11px;color:var(--ink-3);transition:height .2s;font-family:var(--mono);
}
.ax-m-refresh.on{height:34px}

/* 移动首页 */
.ax-m-hero{position:relative;padding:20px 18px 18px;border-bottom:1px solid var(--line);overflow:hidden}
.ax-m-hero::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,var(--red) 0 18px,transparent 18px 24px)}
.ax-m-hero .kick{display:flex;align-items:center;gap:7px;font-size:9.5px;letter-spacing:.22em;color:var(--ink-4);text-transform:uppercase;margin-bottom:7px}
.ax-m-hero .kick::before{content:"";width:14px;height:1px;background:var(--red)}
.ax-m-hero h1{font-family:var(--serif);font-size:27px;line-height:1.15;margin:0 0 3px;letter-spacing:-.01em;overflow-wrap:anywhere}
.ax-m-hero h1 .sl{color:var(--ink-4);font-weight:400;font-size:.6em;padding:0 3px}
.ax-m-hero .ow{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-bottom:8px}
.ax-m-hero .ds{font-family:var(--serif);font-size:14px;line-height:1.7;color:var(--ink-2);margin:0 0 12px}
.ax-m-hero .tp{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.ax-m-hero .tp .ax-chip{background:transparent;border-color:var(--line-soft)}
.ax-m-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin-top:14px}
.ax-m-stats div{background:var(--sheet);padding:9px 10px;text-align:center}
.ax-m-stats .n{font-family:var(--serif);font-size:17px;font-weight:700;line-height:1.2}
.ax-m-stats .l{font-size:9.5px;letter-spacing:.12em;color:var(--ink-4);text-transform:uppercase}
.ax-m-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:16px}
.ax-m-act{
  display:flex;align-items:center;gap:9px;padding:11px 12px;border:1px solid var(--line);
  background:var(--sheet);border-radius:3px;text-align:left;min-height:48px;font-size:12.5px;color:var(--ink-2);
}
.ax-m-act:active{background:var(--sheet-2)}
.ax-m-act svg{width:17px;height:17px;color:var(--red);flex:0 0 auto}
.ax-m-act b{display:block;font-weight:600;font-size:12.5px;line-height:1.35}
.ax-m-act small{display:block;font-size:9.5px;color:var(--ink-4);font-family:var(--mono)}
.ax-m-block{padding:0 16px;margin-top:22px}
.ax-m-block-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.ax-m-block-head h3{font-family:var(--serif);font-size:17px;margin:0;font-weight:700}
.ax-m-block-head .no{font-family:var(--mono);font-size:9.5px;color:var(--ink-4)}
.ax-m-block-head .sp{flex:1}
.ax-m-block-head button{font-size:11px;color:var(--red)}
.ax-m-readme{
  border:1px solid var(--line);background:var(--sheet);border-radius:3px;padding:18px 17px;
  position:relative;overflow:hidden;
}
.ax-m-readme .fade{position:absolute;left:0;right:0;bottom:0;height:100px;background:linear-gradient(180deg,transparent,var(--sheet));pointer-events:none}
.ax-m-readme .ax-prose{font-size:15px;line-height:1.8}
.ax-m-readme .ax-prose pre{font-size:12px}
.ax-m-readme .more{
  position:relative;margin-top:8px;width:100%;padding:10px;border:1px dashed var(--line-hard);
  border-radius:2px;font-size:12px;color:var(--red);background:var(--sheet-2);
}
/* 移动文件 */
.ax-m-filehead{position:sticky;top:0;z-index:5;padding:12px 16px 10px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px)}
.ax-m-crumb{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-bottom:9px;line-height:1.5}
.ax-m-crumb button{color:var(--ink-2);padding:2px 1px;font-family:var(--mono);font-size:11px}
.ax-m-crumb .sep{color:var(--ink-4)}
.ax-m-search{position:relative}
.ax-m-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-4);pointer-events:none}
.ax-m-search input{padding-left:34px;height:42px;min-height:42px;font-size:16px;border-radius:3px}
.ax-m-filegroup{margin:0 16px 18px}
.ax-m-filegroup > h4{display:flex;align-items:center;gap:8px;margin:16px 0 7px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4);font-weight:500}
.ax-m-filegroup > h4::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.ax-m-frow{
  display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;text-align:left;
  background:var(--sheet);border:1px solid var(--line-soft);border-radius:3px;margin-bottom:6px;
  min-height:52px;position:relative;
}
.ax-m-frow:active{background:var(--sheet-2)}
.ax-m-frow .sq{width:32px;height:32px;flex:0 0 auto;display:grid;place-items:center;border-radius:2px;background:var(--sheet-2);border:1px solid var(--line-soft);color:var(--gold);font-family:var(--mono);font-size:10px;letter-spacing:-.03em}
.ax-m-frow.folder .sq{color:var(--ink-3)}
.ax-m-frow .tt{flex:1;min-width:0}
.ax-m-frow .tt b{display:block;font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.ax-m-frow .tt small{display:block;font-size:10px;color:var(--ink-4);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ax-m-frow .go{color:var(--ink-4);font-size:13px;flex:0 0 auto}
.ax-m-frow .st{color:var(--gold);font-size:11px;flex:0 0 auto}
.ax-m-loadmore{display:block;width:calc(100% - 32px);margin:10px 16px 28px;padding:11px;border:1px dashed var(--line-hard);border-radius:2px;font-size:12px;color:var(--ink-2)}

/* 移动阅读页 */
.ax-mreader{
  position:fixed;inset:0;z-index:62;background:var(--paper);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .3s var(--ease);height:100dvh;
}
.ax-mreader.on{transform:none}
.ax-mreader-head{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;
  padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;
  border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--sheet) 90%,transparent);
  backdrop-filter:blur(12px);position:relative;z-index:3;
}
.ax-mreader-head .back{width:38px;height:38px;display:grid;place-items:center;color:var(--ink-2);border-radius:3px;flex:0 0 auto}
.ax-mreader-head .back svg{width:20px;height:20px}
.ax-mreader-head .back:active{background:var(--sheet-2)}
.ax-mreader-head .ttl{flex:1;min-width:0;text-align:left;padding:0 2px}
.ax-mreader-head .ttl b{display:block;font-family:var(--serif);font-size:13.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ax-mreader-head .ttl small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ax-mreader-head .ring{width:34px;height:34px;flex:0 0 auto;position:relative;display:grid;place-items:center;color:var(--ink-3)}
.ax-mreader-head .ring svg{width:30px;height:30px}
.ax-mreader-head .ring span{position:absolute;font-family:var(--mono);font-size:8px;color:var(--ink-3)}
.ax-mreader-body{flex:1;overflow:auto;overscroll-behavior:contain;min-height:0;padding:0 0 60px}
.ax-mreader .ax-paper{margin:12px 10px 30px;padding:26px 20px 34px;border-radius:2px;max-width:none;font-size:var(--fs-read);line-height:var(--lh-read)}
.ax-mreader .ax-paper::before{left:9px}
.ax-mreader .ax-paper-head{padding-bottom:12px;margin-bottom:16px}
.ax-mreader .ax-paper-head h2{font-size:22px}
.ax-mreader .ax-prose pre{font-size:12px}
.ax-mreader .ax-prose h1{font-size:1.6em}
.ax-mreader .ax-prose h2{font-size:1.35em}
.ax-mreader-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:64;display:grid;grid-template-columns:repeat(5,1fr);
  padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--sheet) 94%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
}
.ax-mreader-bar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:9.5px;color:var(--ink-3);min-height:46px;justify-content:center;border-radius:3px}
.ax-mreader-bar button svg{width:19px;height:19px}
.ax-mreader-bar button.on{color:var(--red)}
.ax-mreader-bar button:active{background:var(--sheet-2)}
.ax-mreader-progress{flex:0 0 auto;height:2px;background:var(--line-soft)}
.ax-mreader-progress i{display:block;height:2px;width:0;background:var(--red)}

/* 移动端通用：收藏 / 设置 复用卡片样式 */
@media (max-width:900px){
  .ax-frame{display:none}
  .ax-m{display:flex}
  .ax-hero-side{display:none}
  .ax-shelf{grid-template-columns:1fr}
  .ax-settings{max-width:none}
  .ax-set-card{padding:15px 16px;margin-bottom:12px}
  .ax-set-row{flex-direction:column;align-items:flex-start;gap:7px;padding:10px 0}
  .ax-set-row .lab{min-width:0}
  .ax-set-row .ctl{width:100%;min-width:0}
  .ax-set-card h3{font-size:16px}
  .ax-notes-list{gap:8px}
  .ax-view{padding:16px}
  .ax-toasts{left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:none}
  .ax-scrim.sheet{align-items:flex-end;padding:0}
  .ax-sheet{max-width:none;max-height:88dvh;border-radius:14px 14px 0 0}
}
@media (max-width:1340px){
  .ax-file-layout{grid-template-columns:280px minmax(0,1fr)}
  .ax-outline-pane{display:none}
  .ax-file-layout.show-out{grid-template-columns:280px minmax(0,1fr) 230px}
  .ax-file-layout.show-out .ax-outline-pane{display:flex}
}
@media (max-width:1080px){
  .ax-file-layout{grid-template-columns:250px minmax(0,1fr)}
  .ax-paper{padding:36px 36px 46px}
}
@media (hover:none){
  .ax-btn:hover,.ax-icon-btn:hover,.ax-tree-row:hover,.ax-shelf-card:hover,.ax-mini-item:hover,.ax-result:hover{background:inherit}
}
@media (max-width:900px){
  .ax-m-shell-safe{display:block}
  .ax-m .ax-hero{padding:20px 18px 16px;border-radius:2px}
  .ax-m .ax-hero-top{flex-direction:column;gap:10px}
  .ax-m .ax-hero-side{display:none}
  .ax-m .ax-hero h1{font-size:clamp(26px,8vw,34px)}
  .ax-m .ax-hero .desc{font-size:14px;line-height:1.7}
  .ax-m .ax-hero-actions{gap:6px}
  .ax-m .ax-hero-actions .ax-btn{min-height:38px;padding:0 12px;font-size:12px}
  .ax-m .ax-entry{padding:6px 0 26px;max-width:none}
  .ax-m .ax-entry-head{margin-bottom:13px}
  .ax-m .ax-entry-head h1{font-size:24px}
  .ax-m .ax-entry-field{flex-wrap:wrap;min-height:0}
  .ax-m .ax-entry-field .lead{display:none}
  .ax-m .ax-entry-input{flex:1 1 100%;height:52px;padding:0 14px;font-size:15px}
  .ax-m .ax-entry-clip{order:2;flex:1 1 0;min-height:46px;justify-content:center;border-left:0;border-top:1px solid var(--line-soft)}
  .ax-m .ax-entry-go{order:3;flex:1 1 0;min-height:46px;justify-content:center;padding:0}
  .ax-m .ax-entry-status{font-size:11.5px;margin-top:9px}
  .ax-m .ax-entry-recent{margin-top:26px}
  .ax-m .ax-entry-row{padding:12px 2px}
  .ax-m .ax-grid-2{grid-template-columns:1fr;gap:12px}
  .ax-m .ax-card{padding:16px 16px}
  .ax-m .ax-block-head h3{font-size:17px}
  .ax-m .ax-view-head h2{font-size:23px}
  .ax-m .ax-search-box{flex-wrap:nowrap}
  .ax-m .ax-search-box .ax-btn{flex:0 0 auto;padding:0 14px}
  .ax-m .ax-settings{gap:12px}
  .ax-m .ax-btn{min-height:40px}
  .ax-m-filetree{display:flex;flex-direction:column;gap:8px}
  .ax-m-note-group{margin-bottom:18px}
  .ax-m-note-file{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
  .ax-m-note-file b{font-family:var(--serif);font-size:15px;color:var(--ink)}
  .ax-m-note-file small{font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}
}
/* 移动端滚动更顺滑 */
.ax-m-scroll,.ax-mreader-body,.ax-tree,.ax-reader-scroll,.ax-view{-webkit-overflow-scrolling:touch}
/* 打印 */
@media print{
  .ax-rail,.ax-mast,.ax-outline-pane,.ax-tree-pane,.ax-reader-bar,.ax-m,.ax-mreader-bar,.ax-scrim,.ax-toasts{display:none !important}
  .ax-frame{display:block;height:auto}
  .ax-view{position:static;display:block;overflow:visible;padding:0}
  .ax-paper{box-shadow:none;border:0;margin:0;padding:0;max-width:none}
}
/* ============================================================
   SIGNAL 皮肤层 — 统一改写所有面的形状、边框、动效
   ============================================================ */
:root{--glow:rgba(10,133,120,.18);--tick:rgba(10,133,120,.5)}
html[data-theme="ink"]{--glow:rgba(57,224,196,.22);--tick:rgba(57,224,196,.42)}
@keyframes sg-pulse{0%,100%{opacity:1;box-shadow:0 0 0 3px var(--glow)}50%{opacity:.5;box-shadow:0 0 0 8px transparent}}

/* 侧栏：从“书脊”改为“声呐基座” */
.ax-rail{background:linear-gradient(180deg,#041311 0,#02100e 100%);border-right:1px solid #12312e;padding:18px 10px 12px}
.ax-rail::after{display:none}
.ax-rail .ax-seal{width:46px;height:46px;margin:0 auto 22px;display:grid;place-items:center;position:relative;color:#39e0c4;border:0;border-radius:50%;background:transparent;transform:none;box-shadow:none;font-size:0;letter-spacing:0}
.ax-rail .ax-seal::before{content:"";position:absolute;inset:2px;border:1px solid #39e0c4;border-radius:50%;opacity:.55}
.ax-rail .ax-seal::after{content:"";position:absolute;inset:-7px;border:1px dashed #2b5f59;border-radius:50%;opacity:.75}
.ax-rail .ax-seal span{display:block;width:9px;height:9px;border-radius:50%;background:#39e0c4;box-shadow:0 0 14px rgba(57,224,196,.6);animation:sg-pulse 2.6s infinite}
.ax-rail-btn{color:#7ea8a3;border-radius:0;font-family:var(--mono);font-size:10px;letter-spacing:.12em;min-height:52px}
.ax-rail-btn:hover{background:rgba(57,224,196,.07);color:#d8f2ed}
.ax-rail-btn.on{background:transparent;color:#39e0c4}
.ax-rail-btn.on::before{left:-10px;top:14px;bottom:14px;width:2px;background:#39e0c4;box-shadow:0 0 10px #39e0c4}
.ax-rail-btn.on svg{filter:drop-shadow(0 0 6px rgba(57,224,196,.5))}
.ax-rail-foot{border-top:1px solid #12312e;padding-top:10px}

/* 顶栏：目标锁定条 */
.ax-mast{min-height:58px;padding:9px 18px;background:color-mix(in srgb,var(--paper) 88%,transparent);border-bottom:1px solid var(--line-hard);backdrop-filter:blur(10px)}
.ax-crumb{border-radius:0;max-width:36%}
.ax-crumb .kicker{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--red);padding:1px 5px;border:1px solid var(--red-soft);background:var(--red-soft)}
.ax-crumb .name{font-family:var(--sans);font-size:16px;font-weight:700;letter-spacing:-.02em}
.ax-crumb:hover{background:var(--sheet-2);border-color:var(--line-hard)}
.ax-mast-search{border-radius:0;background:var(--sheet);font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.ax-mast-search:hover{border-color:var(--red);box-shadow:0 0 0 1px var(--red-soft) inset}
.ax-icon-btn{border-radius:0}
.ax-icon-btn:hover{border-color:var(--line-hard);background:var(--sheet)}

/* 通用按钮：硬边、等宽、信号填充 */
.ax-btn{border-radius:0;border-color:var(--line-hard);background:var(--sheet);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;box-shadow:none}
.ax-btn:hover{background:var(--sheet-2);border-color:var(--red);color:var(--ink)}
.ax-btn:active{transform:none;background:var(--red-soft)}
.ax-btn.solid{background:var(--red);border-color:var(--red);color:#04120f;font-weight:700}
.ax-btn.solid:hover{background:var(--red-deep);border-color:var(--red-deep);color:#04120f;box-shadow:0 0 22px -6px var(--red)}
html[data-theme="ink"] .ax-btn.solid{color:#03100f}
.ax-btn.ghost{border-color:transparent;background:transparent}
.ax-btn.on{background:var(--red-soft);border-color:var(--red)}
.ax-chip{border-radius:0;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.ax-pill{border-radius:0;font-family:var(--mono);font-size:10px}
.ax-input,.ax-select,.ax-textarea{border-radius:0;background:var(--sheet)}
.ax-input:focus,.ax-select:focus,.ax-textarea:focus{border-color:var(--red);box-shadow:0 0 0 2px var(--red-soft) inset}
.ax-toggle{border-radius:0}
.ax-seg{border-radius:0}
.ax-seg button{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em}
.ax-seg button.on{background:var(--red);color:#04120f}
html[data-theme="ink"] .ax-seg button.on{background:var(--red);color:#03100f}

/* 视图头：编号 + 细线 + 刻度 */
.ax-view-head{border-bottom:1px solid var(--line-hard);align-items:center;padding-bottom:10px;margin-bottom:20px}
.ax-view-head .no{font-size:9.5px;letter-spacing:.24em;color:var(--red);border:1px solid var(--red-soft);background:var(--red-soft);padding:2px 6px}
.ax-view-head h2{font-family:var(--sans);font-weight:800;letter-spacing:-.035em;font-size:26px}
.ax-view-head .sub{font-family:var(--mono);font-size:10px;letter-spacing:.1em}
.ax-block-head h3{font-family:var(--sans);font-weight:700;letter-spacing:-.02em}
.ax-block-head .idx{font-size:9.5px;letter-spacing:.14em;color:var(--red)}
.ax-empty .big{font-family:var(--sans);font-weight:800;letter-spacing:-.03em}
.ax-empty .mark{border-radius:50%;border:1px solid var(--red);color:var(--red);font-family:var(--mono);font-size:18px;box-shadow:0 0 0 8px var(--glow)}

/* 面板：直角 + 角标刻度 */
.ax-card,.ax-set-card,.ax-shelf-card,.ax-note-card,.ax-rel,.ax-hero,.ax-entry-deck,.ax-m-readme{border-radius:0;box-shadow:none;border-color:var(--line)}
.ax-hero,.ax-entry-deck,.ax-set-card{background-image:
  linear-gradient(90deg,var(--tick) 0 14px,transparent 14px) 0 0/100% 1px no-repeat,
  linear-gradient(180deg,var(--tick) 0 14px,transparent 14px) 0 0/1px 100% no-repeat,
  linear-gradient(270deg,var(--tick) 0 14px,transparent 14px) 100% 0/100% 1px no-repeat,
  linear-gradient(180deg,var(--tick) 0 14px,transparent 14px) 100% 0/1px 100% no-repeat,
  linear-gradient(90deg,var(--tick) 0 14px,transparent 14px) 0 100%/100% 1px no-repeat,
  linear-gradient(0deg,var(--tick) 0 14px,transparent 14px) 0 100%/1px 100% no-repeat,
  linear-gradient(270deg,var(--tick) 0 14px,transparent 14px) 100% 100%/100% 1px no-repeat,
  linear-gradient(0deg,var(--tick) 0 14px,transparent 14px) 100% 100%/1px 100% no-repeat;
}
.ax-card.flat{background:var(--sheet-2);box-shadow:none}
.ax-card h4{font-family:var(--sans);font-weight:700}
.ax-mini-item .ic{border-radius:0;font-size:9px}
.ax-mini-item .tt b{font-weight:600}
.ax-filechip{border-radius:0;background:var(--sheet)}
.ax-filechip:hover{border-color:var(--red)}

/* 仓库主面板：不再盖章，改为“目标锁定” */
.ax-hero{padding:24px 28px 20px;background-color:var(--sheet);position:relative;overflow:hidden}
.ax-hero-dial{position:absolute;right:-84px;top:-104px;width:320px;height:320px;border-radius:50%;pointer-events:none;opacity:.55}
.ax-hero-main,.ax-stats,.ax-hero-alert{position:relative;z-index:1}
.ax-hero-dial span{position:absolute;inset:0;border:1px solid var(--line-hard);border-radius:50%}
